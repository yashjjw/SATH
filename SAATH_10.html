function trendFigure(key,mode,from){return '<div class="tchart" data-k="'+key+'" data-mode="'+mode+'" data-from="'+(from||0)+'"></div>';}
function trendChartSvg(key,mode,from,W){
 const l=S.labs[key];
 const all=l.r.map((r,i)=>({r:r,i:i})).filter(o=>o.r[0]>=from).sort((a,b)=>a.r[0]-b.r[0]);
 const n=all.length;if(!n)return '';
 const H=mode==='card'?178:mode==='sheet'?220:132,ml=40,mr=20,mt=mode==='mini'?22:34,mb=30,bp=key==='bp';
 const fs=bp?[r=>+String(r[1]).split('/')[0],r=>+String(r[1]).split('/')[1]]:[r=>+r[1]];
 const bd=tcBand(l);const vals=[];fs.forEach(f=>all.forEach(o=>vals.push(f(o.r))));
 let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
 if(typeof l.lo==='number')lo=Math.min(lo,l.lo);if(typeof l.hi==='number')hi=Math.max(hi,l.hi);
 const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
 const x0=all[0].r[0],x1=all[n-1].r[0],iw=W-ml-mr;
 const X=tm=>n===1||x1===x0?ml+iw/2:ml+(tm-x0)/(x1-x0)*iw,Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);
 let g='';
 const edge=(v,lab)=>{if(v==null)return '';const y=Y(+v);return '<line class="tc-band" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="tc-ax" x="'+(ml-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+lab+'</text>';};
 let cap='';
 if(bd){g+=edge(l.hi,bd.hi)+edge(l.lo,bd.lo);
  const lastDoc=all[n-1].r[3]&&S.docs.find(d=>d.id===all[n-1].r[3]);
  cap=t('छपी हुई सीमा ','printed range ')+bd.text+(lastDoc&&W>=330?' · '+(lastDoc.lab||lastDoc.fac):'');}
 else{[Math.ceil((lo+pad)/10)*10,Math.floor((hi-pad)/10)*10].forEach(v=>{g+='<text class="tc-ax" x="'+(ml-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v+'</text>';});
  cap=t('क्लिनिक की पर्ची पर कोई सीमा नहीं छपी','no range printed on a clinic slip');}
 if(mode!=='mini')g+='<text class="tc-ax" x="'+(ml+4)+'" y="'+(mt-(mode==='card'?10:12))+'">'+cap+'</text>';
 if(n>=3)fs.forEach(f=>{g+='<path class="tc-curve" d="'+monoPath(all.map(o=>[X(o.r[0]),Y(f(o.r))]))+'"/>';});
 all.forEach(o=>{
  const cx=X(o.r[0]),ys=fs.map(f=>Y(f(o.r))),cy=(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2,fl=o.r[2];
  const hit=bp?'<rect class="tc-hit" x="'+(cx-22)+'" y="'+(Math.min.apply(null,ys)-22)+'" width="44" height="'+(Math.max.apply(null,ys)-Math.min.apply(null,ys)+44)+'"/>':'<circle class="tc-hit" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="22"/>';
  g+='<g class="tpt" tabindex="0" role="button" data-i="'+o.i+'" data-cx="'+cx.toFixed(1)+'" data-cy="'+Math.min.apply(null,ys).toFixed(1)+'" aria-label="'+esc(fDY(o.r[0])+', '+o.r[1]+' '+(bp?'':l.u)+(fl?', '+t('लैब ने चिह्नित किया ','lab flagged ')+fl:''))+'">'+hit+
   fs.map((f,k)=>'<circle class="tc-ring" cx="'+cx.toFixed(1)+'" cy="'+ys[k].toFixed(1)+'" r="9"/><circle class="tc-dot'+(fl?' flag':'')+'" cx="'+cx.toFixed(1)+'" cy="'+ys[k].toFixed(1)+'" r="4.5"/>').join('')+
   (fl?'<text class="tc-flag" x="'+cx.toFixed(1)+'" y="'+(Math.min.apply(null,ys)-11).toFixed(1)+'" text-anchor="middle">'+esc(fl)+'</text>':'')+'</g>';});
 const dlab=(tm,a)=>'<text class="tc-ax" x="'+(a==='end'?W-mr:ml)+'" y="'+(H-8)+'" text-anchor="'+a+'">'+(a==='end'?fD(tm):fDY(tm))+'</text>';
 if(n>=2)g+=dlab(x0,'start')+dlab(x1,'end');else g+=dlab(x0,'start');
 const nm=l.n+', '+n+' '+t('रीडिंग','readings');
 return '<svg class="tc-svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="'+esc(nm+(bd?'. '+cap:''))+'">'+g+'</svg>';
}
const TC_DRAWN={};
function fitCharts(){
 document.querySelectorAll('.tchart').forEach(el=>{
  const W=Math.floor(el.clientWidth);if(W<200)return;
  if(el.dataset.kind==='reserve'){el.innerHTML=reserveSvg(W)+'<div class="ttip" hidden></div>';return;}
  if(el.dataset.kind==='decisions'){el.innerHTML=decisionsSvg(W)+'<div class="ttip" hidden></div>';return;}
  const key=el.dataset.k,mode=el.dataset.mode,from=+el.dataset.from||0;
  const n=S.labs[key].r.filter(r=>r[0]>=from).length;
  el.innerHTML=trendChartSvg(key,mode,from,W)+'<div class="ttip" hidden></div>'+
   (mode!=='mini'?'<p class="tc-note">'+(n>=3?TCN():n===2?t('दो रीडिंग, बिंदु के रूप में।','Two readings, shown as points.'):'')+(key==='bp'&&n>=2?' '+t('ऊपर की रेखा ऊपर वाली संख्या है।','The upper line is the top number.'):'')+'</p>':'');
  const dk=key+mode+from;
  if(!RM&&!TC_DRAWN[dk]){TC_DRAWN[dk]=1;el.querySelectorAll('.tc-curve').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition='stroke-dashoffset .9s ease-out';p.style.strokeDashoffset=0;});}
 });
}
let TC_PIN=null;
function tcHide(el){const tip=el&&el.querySelector('.ttip');if(tip)tip.hidden=true;if(el&&TC_PIN&&el.contains(TC_PIN))TC_PIN=null;}
function tcShow(g,pin){
 const el=g.closest('.tchart');if(!el)return;
 document.querySelectorAll('.tchart .ttip').forEach(x=>{if(x.parentNode!==el)x.hidden=true;});
 const tip=el.querySelector('.ttip');
 if(g.dataset.tip){const o=JSON.parse(g.dataset.tip);tip.innerHTML='<b class="tnum" style="font:600 var(--t-3) var(--fb)">'+esc(o.h)+'</b>'+o.l.map(x=>'<div class="tnum">'+esc(x)+'</div>').join('');}
 else{
 const l=S.labs[el.dataset.k],r=l.r[+g.dataset.i],doc=r[3]&&S.docs.find(d=>d.id===r[3]);
 const range=doc&&doc.values&&(doc.values.find(v=>v.label===l.n)||{}).range;
 tip.innerHTML='<b class="tnum" style="font:600 var(--t-3) var(--fb)">'+esc(r[1])+(el.dataset.k==='bp'?'':' '+l.u)+'</b><div class="tnum">'+fDY(r[0])+'</div>'+
  '<div>'+t('स्रोत: ','Source: ')+(doc?esc(doc.title):t('क्लिनिक की पर्ची','Clinic slip'))+'</div>'+
  (r[2]?'<div>'+t('लैब ने चिह्नित किया: ','Lab flagged: ')+'<b>'+esc(r[2])+'</b>'+(doc&&(doc.lab||doc.fac)?' · '+esc(doc.lab||doc.fac):'')+'</div>':'')+
  (range?'<div class="ink3">'+t('इस रिपोर्ट पर छपी सीमा ','Range printed on this report: ')+esc(range)+'</div>':'');
 }
 tip.hidden=false;
 const W=el.clientWidth,tw=tip.offsetWidth,th=tip.offsetHeight,cx=+g.dataset.cx,cy=+g.dataset.cy;
 tip.style.left=Math.max(4,Math.min(W-tw-4,cx-tw/2))+'px';
 tip.style.top=(cy-th-16>0?cy-th-16:cy+18)+'px';
 TC_PIN=pin?g:null;
}
function tcBind(){
 document.addEventListener('mouseover',e=>{const g=e.target.closest&&e.target.closest('.tpt');if(g&&!TC_PIN)tcShow(g,false);});
 document.addEventListener('mouseout',e=>{const g=e.target.closest&&e.target.closest('.tpt');if(g&&!TC_PIN&&!(e.relatedTarget&&g.contains(e.relatedTarget)))tcHide(g.closest('.tchart'));});
 document.addEventListener('focusin',e=>{const g=e.target.closest&&e.target.closest('.tpt');if(g)tcShow(g,false);});
 document.addEventListener('focusout',e=>{const g=e.target.closest&&e.target.closest('.tpt');if(g&&!TC_PIN)tcHide(g.closest('.tchart'));});
 document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.tpt');
  if(g){e.stopPropagation();e.preventDefault();TC_PIN&&TC_PIN===g?(tcHide(g.closest('.tchart')),TC_PIN=null):tcShow(g,true);return;}
  if(TC_PIN&&!(e.target.closest&&e.target.closest('.ttip'))){tcHide(TC_PIN.closest('.tchart'));TC_PIN=null;}},true);
 document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('.tpt');if(!g)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const pts=[].slice.call(g.closest('.tchart').querySelectorAll('.tpt'));const nx=pts[pts.indexOf(g)+(e.key==='ArrowRight'?1:-1)];if(nx){nx.focus();e.preventDefault();}}
  else if(e.key==='Escape'){tcHide(g.closest('.tchart'));TC_PIN=null;e.stopPropagation();}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();tcShow(g,true);}},true);
 let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fitCharts,120);});
}

/* ===================== WHY: the decision ledger as a first-class view =====================
   v1 logged every consequential action but only ever showed the title and the
   time inside a timeline sheet. The whole defensibility argument lives in the
   other four fields, so they get a view: evidence, rule, authority, decision,
   what happened, and which connector moved. A refusal is rendered exactly as
   prominently as an action, because refusing well is the product. */
const DEC_TONE={BLOCKED:'crit',HELD:'warn',REFUSED:'warn',NEEDS_APPROVAL:'warn',ALLOWED:'good',ACCEPTED:'good',ACTED:'good',PRESENTED:'good',REPORTED:'wait'};
const DEC_LABEL={BLOCKED:['रोका','Blocked'],HELD:['रोके रखा','Held'],REFUSED:['मना किया','Refused'],NEEDS_APPROVAL:['मंज़ूरी चाहिए','Needs approval'],ALLOWED:['अनुमति','Allowed'],ACCEPTED:['स्वीकार','Accepted'],ACTED:['कार्रवाई','Acted'],PRESENTED:['रिज़र्व से काटा','Presented'],REPORTED:['बताया','Reported']};
const WHY_FILTERS=[['all','सब','All'],['stops','रुकावट','Stops only'],['acts','कार्रवाई','Actions only']];
function whyTone(d){return DEC_TONE[d]||'wait';}
function decisionChip(d){
 const tone=whyTone(d), l=DEC_LABEL[d]||[d,d];
 return '<span class="chip" style="background:var(--'+tone+'-bg);color:var(--'+tone+'-fg)">'+t(l[0],l[1])+'</span>';
}

const STAMPED={BLOCKED:1,HELD:1,REFUSED:1,NEEDS_APPROVAL:1};
function stampSvg(e){
 const l=(DEC_LABEL[e.decision]||[e.decision,e.decision])[1].toUpperCase();
 const rule=lg(e.rule||'').split('·')[0].trim().toUpperCase();
 const w=l.length>12?172:148;
 return '<svg class="stamp" width="'+w+'" height="60" viewBox="0 0 '+w+' 60" role="img" aria-label="Stamped '+l+'">'+
 '<rect x="2.2" y="2.2" width="'+(w-4.4)+'" height="55.6" rx="4" fill="none" stroke="var(--dtone)" stroke-width="2.4" opacity=".8"/>'+
 '<rect x="6.4" y="6.4" width="'+(w-12.8)+'" height="47.2" rx="2" fill="none" stroke="var(--dtone)" stroke-width="1" opacity=".5"/>'+
 '<text x="'+(w/2)+'" y="28" text-anchor="middle" font-size="16.5" letter-spacing="1.1">'+l+'</text>'+
 '<text x="'+(w/2)+'" y="44" text-anchor="middle" font-size="12" letter-spacing=".6" opacity=".9">'+esc(rule)+'</text></svg>';
}

function ledgerFor(){const v=S.viewer;return S.ledger.filter(e=>{const a=e.aud||'care';return v==='meera'||a==='all'||(v==='arjun'?a==='payer':a==='care');});}
VIEWS.why=()=>{
 const f=S.whyFilter||'all';
 const stops=['BLOCKED','HELD','REFUSED','NEEDS_APPROVAL'];

/* Remembers the last rendered text of every [data-cnum] figure so a changed
   number gets a brief, deliberate pulse instead of silently flipping —
   the same countPulse keyframe the tokens file already defines. */
const _lastNum={};
function bumpChangedNumbers(){
 $$('[data-cnum]').forEach(el=>{
  const k=el.dataset.cnum,v=el.textContent;
  if(_lastNum[k]!==undefined&&_lastNum[k]!==v)el.classList.add('tnum-bump');
  _lastNum[k]=v;
 });
}

let lastFocus=null;
function overlayOpen(el,html,key){
 if(!el.classList.contains('on'))lastFocus=document.activeElement;
 el.innerHTML=html;el.classList.add('on');$('#scrim').classList.add('on');document.body.style.overflow='hidden';
 const h=el.querySelector('h3');if(h){if(!h.id)h.id=key+'Title';el.setAttribute('aria-labelledby',h.id);}else el.removeAttribute('aria-labelledby');
 el.setAttribute('tabindex','-1');try{el.focus({preventScroll:true});}catch(e){}
 fitCharts();hiDom();
}
function openModal(html){overlayOpen($('#modal'),html,'m');}
function closeModal(){$('#modal').classList.remove('on');$('#scrim').classList.remove('on');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function openSheet(html){overlayOpen($('#sheet'),html,'s');}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function trapTab(e){
 if(e.key!=='Tab')return;
 const el=$('#modal.on')||$('#sheet.on');if(!el)return;
 const f=$$('button:not([disabled]),input,[href],[tabindex]:not([tabindex="-1"])',el).filter(x=>x.offsetParent!==null);
 if(!f.length){e.preventDefault();return;}
 const first=f[0],last=f[f.length-1];
 if(e.shiftKey&&(document.activeElement===first||document.activeElement===el)){e.preventDefault();last.focus();}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}
function closeAll(){closeModal();closeSheet();}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function later(fn,ms){setTimeout(fn,RM?10:ms);}

/* ===================== Why / Agent sheet =====================
   Generalized across every execution entity (task, appointment, checkup) so
   each one carries the same {status, wf, rule, authority, evidence} shape.
   'why:t1' (no colon) still resolves to a task exactly as before — this is
   additive, not a breaking change to the existing task call sites. */
function whyLookup(key){
 let kind='task',id=key;
 if(key.indexOf(':')>-1){const p=key.split(':');kind=p[0];id=p.slice(1).join(':');}
 if(kind==='task'){const x=S.tasks.find(x=>x.id===id);if(!x)return null;
  return{title:x.title,status:x.status,rule:x.agent.rule,authority:x.agent.authority,evidence:x.agent.evidence,state:x.agent.state,who:S.family[x.owner].name};}
 if(kind==='appt'){const x=S.appts.find(a=>a.id===id);if(!x||!x.wf)return null;
  return{title:x.doctor+' · '+x.spec,status:x.status,rule:x.rule,authority:x.authority,evidence:x.evidence,state:x.wf,who:x.authority};}
 if(kind==='checkup'){const x=S.checkups.find(c=>c.id===id);if(!x||!x.wf)return null;
  return{title:x.title,status:x.status,rule:x.rule,authority:x.authority,evidence:x.evidence,state:x.wf,who:S.family[x.assignee]?S.family[x.assignee].name:x.authority};}
 if(kind==='payment'){const r=S.refill;
  return{title:'Refill payment',status:r.payStatus==='presented'?'completed':(r.payStatus==='presenting'?'confirmed':(r.step==='needsapproval'?'needsapproval':'waiting')),
   rule:'Per-order limit '+inr(S.money.limit),authority:(r.step==='needsapproval'?'Priya':'SAATH policy layer'),
   evidence:'pineLabsAdapter: checkMandate → presentDebit, amount '+inr(r.newAmount||S.refillAmount||802),state:(r.payStatus||'idle').toUpperCase(),who:'Priya'};}
 if(kind==='delivery'){const r=S.refill;
  return{title:'Refill delivery',status:r.step==='delivered'?'completed':(r.exception?'onhold':'ontheway'),
   rule:'Delhivery lifecycle',authority:'Delhivery',evidence:'AWB '+(r.awb||'—')+(r.exception?' · exception: '+r.exception:''),
   state:(r.delivStatus||r.step||'idle').toUpperCase(),who:'Delhivery'};}
 if(kind==='packverify'){const r=S.packverify;if(!r.lastResult)return null;
  const m=S.meds.find(x=>x.id===r.lastMedId);
  return{title:'Pack verification'+(m?' · '+m.name:''),status:r.lastResult.outcome==='exact'?'completed':'onhold',
   rule:'classifyPackPhoto (deterministic composition check)',authority:r.lastResult.authority||'—',
   evidence:r.lastResult.detail,state:r.lastResult.outcome.toUpperCase(),who:r.lastResult.authority||'—'};}
 if(kind==='report'){const d=S.docs.find(x=>x.id===id);if(!d)return null;
  return{title:d.title,status:'completed',rule:'filterDocs() over S.docs (real metadata match, never canned)',
   authority:d.doctorId?S.family[d.doctorId].name:'—',evidence:(d.lab||d.hospital||'')+' · '+fDY(d.date),
   state:'ON_FILE',who:d.doctorId?S.family[d.doctorId].name:'—'};}
 if(kind==='insurance'){const p=S.insurance.procedures.find(x=>x.id===id);if(!p)return null;
  const pa=S.insurance.preauth[id];
  return{title:p.name,status:p.listed?(pa?'waiting':'confirmed'):'onhold',
   rule:p.listed?'Policy clause match':'Not listed on policy',authority:p.listed?(p.preauthRequired?'Insurer (pre-auth)':'—'):'Insurer',
   evidence:p.clause,state:(p.listed?(p.preauthRequired?(pa?'PREAUTH_REQUESTED':'PREAUTH_REQUIRED'):'LISTED'):'NOT_LISTED'),who:'Insurer'};}
 return null;
}
function whySheet(key){
 const x=whyLookup(key);if(!x)return;
 let body='<div class="sheet-handle"></div><h3>'+esc(x.title)+'</h3>';
 if(!S.agentView){
  body+='<p class="muted" style="margin-top:8px">'+chip(x.status)+'</p><p style="margin-top:12px;font-size:var(--t-3);line-height:1.55">'+esc(x.evidence)+'</p><p class="muted" style="margin-top:10px;font-size:var(--t-2)">'+t('हल कौन कर सकता है: ','Who can resolve it: ')+esc(x.who)+'</p>';

   '<div class="agent-row"><k>Rule</k><code>'+esc(x.rule)+'</code></div>'+

/* ===================== history: chronological timeline + trends =====================
   Pass 5: a real causal chain (visit -> prescription -> task -> test ->
   report -> refill -> payment -> delivery -> follow-up), built straight
   from S.ledger (every consequential action already logs here with a real
   S.now timestamp at the moment it happened) grouped by day, PLUS a
   trends sub-tab with 1m/3m/6m/All range toggles sourced from S.labs'
   actual dated readings, and an explicit previous-vs-latest comparison
   that states only changed/unchanged/not-measured — never a medical
   interpretation ("improving"/"worsening" never appear here). */
function historySheet(){openSheet(historySheetBody());}
function historySheetBody(){
 const tabs=[['timeline',t('समयरेखा','Timeline')],['trends',t('ट्रेंड्स','Trends')]].filter(x=>x[0]==='timeline'||S.viewer!=='arjun');
 return '<div class="sheet-handle"></div><h3>'+t('इतिहास और ट्रेंड','History & trends')+'</h3>'+
 '<div class="tabs" style="margin-top:10px">'+tabs.map(x=>'<button data-act="history:tab:'+x[0]+'" aria-pressed="'+(S.historyTab===x[0])+'">'+x[1]+'</button>').join('')+'</div>'+
 (S.historyTab==='trends'&&S.viewer!=='arjun'?trendsTabHtml():timelineTabHtml())+
 '<button class="btn btn-sec btn-block" style="margin-top:14px" data-act="closeSheet">'+t('बंद करें','Close')+'</button>';
}
function timelineTabHtml(){
 const rows=ledgerFor().slice(0,40);
 const groups=[];let lastKey=null;
 rows.forEach(e=>{const key=fDY(e.t);if(key!==lastKey){groups.push({key,items:[]});lastKey=key;}groups[groups.length-1].items.push(e);});
 return '<div class="list" style="margin-top:12px;max-height:52vh;overflow-y:auto">'+
 (groups.length?groups.map(g=>'<p class="ink3" style="font-size:var(--t-1);font-weight:700;text-transform:uppercase;margin:10px 0 2px">'+g.key+'</p>'+
  g.items.map(e=>'<div class="li" style="cursor:default;align-items:flex-start"><span class="li-ic">'+ic(e.icon||'info')+'</span><span class="li-main"><span class="li-t">'+esc(lg(e.title))+'</span><span class="li-s">'+fT(e.t)+(S.agentView&&e.rule&&e.rule!=='—'?' · '+esc(lg(e.rule)):'')+'</span>'+(S.agentView&&e.evidence?'<span class="li-s" style="display:block;margin-top:2px">'+esc(lg(e.evidence))+'</span>':'')+'</span></div>').join('')).join('')
  :'<p class="muted" style="padding:14px 0">'+t('अभी कोई गतिविधि नहीं।','Nothing yet.')+'</p>')+
 '</div>';
}
const TREND_RANGES={'1m':30,'3m':92,'6m':183,'all':999999};
const trendFrom=range=>Math.max(0,S.now-(TREND_RANGES[range]||TREND_RANGES['6m'])*86400000);
function trendSeries(key,range){
 return S.labs[key].r.filter(r=>r[0]>=trendFrom(range));
}
function trendCompare(key,range){
 const series=trendSeries(key,range);
 if(!series.length)return{state:'not-measured',text:t('इस अवधि में कोई रीडिंग नहीं','No reading in this range')};
 if(series.length<2)return{state:'not-measured',text:t('सिर्फ़ एक रीडिंग, तुलना के लिए दूसरी नहीं','Only one reading, nothing earlier to compare in this range')};
 const prev=series[series.length-2],latest=series[series.length-1];
 const changed=String(prev[1])!==String(latest[1]);
 return{state:changed?'changed':'unchanged',prev,latest,
  text:(changed?t('बदला: ','Changed: '):t('अपरिवर्तित: ','Unchanged: '))+prev[1]+' ('+fD(prev[0])+') → '+latest[1]+' ('+fD(latest[0])+')'};
}
function trendsTabHtml(){
 const ranges=[['1m','1M'],['3m','3M'],['6m','6M'],['all','All']];
 return '<div class="tabs" style="margin-top:10px">'+ranges.map(r=>'<button data-act="trend:range:'+r[0]+'" aria-pressed="'+(S.trendRange===r[0])+'">'+r[1]+'</button>').join('')+'</div>'+
 '<p class="tc-note" style="margin-top:8px">'+TCN()+'</p><div class="list" style="margin-top:10px;max-height:50vh;overflow-y:auto;gap:12px">'+
 Object.keys(S.labs).map(key=>{
  const l=S.labs[key];const series=trendSeries(key,S.trendRange);const cmp=trendCompare(key,S.trendRange);
  return '<div class="card" style="box-shadow:none;background:var(--surface-2)"><div class="row between"><b style="font:600 var(--t-2) var(--fb)">'+l.n+'</b><span class="muted" style="font-size:var(--t-1)">'+l.u+'</span></div>'+
   (series.length>1?'<div style="margin-top:8px">'+trendFigure(key,'mini',trendFrom(S.trendRange))+'</div>':series.length?'<p class="tnum" style="margin-top:8px"><b>'+series[0][1]+'</b> <span class="ink3">'+fD(series[0][0])+'</span></p>':'<p class="muted" style="font-size:var(--t-1);margin-top:8px">'+t('इस अवधि में डेटा नहीं','No data in this range')+'</p>')+
   '<p style="margin-top:6px;font-size:var(--t-1)"><span class="chip st-'+(cmp.state==='changed'?'ontheway':(cmp.state==='unchanged'?'confirmed':'waiting'))+'">'+tcState(cmp.state)+'</span> '+esc(cmp.text)+'</p>'+
  '</div>';
 }).join('')+
 '</div>'+
 '<button class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" data-act="trend:compareall">'+t('सभी की तुलना देखें','View full comparison')+'</button>';
}

 '<p style="margin-top:10px;font-size:var(--t-2)"><span class="chip st-'+(cmp.state==='changed'?'ontheway':(cmp.state==='unchanged'?'confirmed':'waiting'))+'">'+tcState(cmp.state)+'</span> '+esc(cmp.text)+'</p>'+

}

/* ===================== idempotency guard =====================
   Wraps a handler so a second invocation while the first is still "in
   flight" (sync or async) is dropped instead of double-booking, double-
   charging or double-logging. Keyed by name, not by instance, since this
   is a single-user demo with one shared S. */
const INFLIGHT=new Set();
function guard(key,fn){
 return(...a)=>{
  if(INFLIGHT.has(key))return;
  INFLIGHT.add(key);
  const release=()=>INFLIGHT.delete(key);
  try{
   const r=fn(...a);
   if(r&&typeof r.then==='function')r.then(release,release);
   else release();
   return r;
  }catch(e){release();throw e;}
 };
}

/* ===================== record upload: apply the simulated extraction =====================
   mode: 'new' (no duplicate found, or confirmed despite a name mismatch),
   'merge' (keep the existing doc, drop the new one), 'keepboth' (file both
   as separate entries), 'replace' (swap the new one in for the old).
   Prescriptions always VERSION rather than overwrite: a new rx un-latests
   the previous one and links back via supersedes, never deleting it. */
function applyRecordUpload(mode){
 const u=S.recUpload,ex=u.extraction;if(!ex)return;
 if(mode==='merge'){
  const dup=S.docs.find(x=>x.id===u.dupOf);
  if(dup&&ex.values&&ex.values.length)dup.values=ex.values;
  logEvent(tb('रिपोर्ट मर्ज हुई','Report merged'),{rule:'Duplicate detection (same test + date)',authority:S.family[S.viewer].name,evidence:(dup?dup.title:'')+' kept, new values merged in',action:'Merged, no duplicate filed',icon:'check'});
  toast(t('मौजूदा रिपोर्ट में मर्ज किया गया','Merged into the existing report'),'check');
  S.recUpload.stage='done';openSheet(recordUploadSheetBody());render();return;
 }
 let d;
 if(u.cat==='rx'||ex.rx){
  const prevLatest=S.docs.find(x=>x.docType==='rx'&&x.latest);
  if(mode!=='replace'&&prevLatest)prevLatest.latest=false;
  d={id:uid(),title:'Prescription · '+fD(ex.date),docType:'rx',cat:'rx',date:ex.date,
   fac:ex.doctorId&&S.family[ex.doctorId]?S.family[ex.doctorId].name+', Mehta Clinic':t('अभी अपलोड किया गया','Uploaded just now'),
   doctorId:ex.doctorId,hospital:'Mehta Clinic',patient:ex.patient,supersedes:(mode!=='replace'&&prevLatest)?prevLatest.id:null,latest:true,linkedMedicineIds:[]};
 } else {
  d={id:uid(),title:(ex.testType||'Report')+' · '+fD(ex.date),docType:u.cat||'lab',cat:u.cat||'lab',date:ex.date,
   fac:ex.lab||t('अभी अपलोड किया गया','Uploaded just now'),doctorId:ex.doctorId,lab:ex.lab,hospital:ex.lab,testType:ex.testType,
   patient:ex.patient,values:ex.values||[],linkedMedicineIds:[],flaggedWrongPatient:ex.patient!=='Ramesh Sharma'};
 }
 if(mode==='replace'&&u.dupOf){const idx=S.docs.findIndex(x=>x.id===u.dupOf);if(idx>-1)S.docs.splice(idx,1,d);else S.docs.unshift(d);}
 else S.docs.unshift(d);
 logEvent(tb('नया दस्तावेज़ अपलोड हुआ','New document uploaded'),{rule:mode==='replace'?'Replace existing':(d.docType==='rx'?'Prescription versioning':'Upload'),
  authority:S.family[S.viewer].name,evidence:d.title+(ex.patient!=='Ramesh Sharma'?' · patient name confirmed by '+S.family[S.viewer].name:''),action:'Added to record library',icon:'upload'});
 toast(t('दस्तावेज़ जोड़ा गया','Document filed'),'upload');
 S.recCat=d.docType;S.recUpload.stage='done';S.recUpload.pendingDoc=d.id;openSheet(recordUploadSheetBody());render();
}

 'visit:apply':guard('visit-apply',()=>{
  const already=S.meds.find(m=>m.id==='metformin');
  const dose='Timing unclear — audio says once (morning); prescription says twice daily, with meals';
  if(already){already.status='onhold';already.dose=dose;already.src='Prescription · '+fD(S.now);}
  else S.meds.push({id:'metformin',name:'Metformin',str:'500 mg',dose,stock:0,daily:2,status:'onhold',src:'Prescription · '+fD(S.now)});
  S.tasks.push({id:uid(),title:'Metformin frequency needs clarification',owner:'mehta',status:'onhold',agent:{state:'NEEDS_CLARIFICATION',rule:'S2 (written prescription governs)',authority:'Prescriber',evidence:'Recording says once daily; prescription says twice daily, with meals'}});
  S.checkups.push({id:uid(),title:'Lipid profile',items:['Lipid profile'],due:S.now+10*86400000,assignee:'meera',status:'needsaction',phase:'due',arrangeStage:'idle',remindPending:false,advancePending:false,snoozeCount:0,
   wf:'REQUESTED',rule:'Ordered during visit',authority:'Dr. Rajiv Mehta',evidence:'Prescribed at the '+fD(S.now)+' visit, due within 10 days'});
  S.tasks.push({id:uid(),title:'Book follow-up with Dr. Mehta (in 3 weeks)',owner:'neha',status:'needsaction',agent:{state:'REQUESTED',rule:'Follow-up instruction',authority:'Dr. Rajiv Mehta',evidence:'Asked to review again in about 3 weeks'}});
  S.docs.unshift({id:uid(),title:'Prescription · '+fD(S.now),cat:'rx',date:S.now,fac:'Dr. Mehta, Mehta Clinic'});
  addLedger({title:'Metformin frequency conflict',rule:'S2',authority:'Prescriber',evidence:'Audio: once daily, morning. Prescription: twice daily, with meals.',decision:'HELD',action:'Metformin schedule paused; Telmisartan, the lipid test and the follow-up all proceeded'});
  logEvent(tb('विज़िट दर्ज हुई','Doctor visit logged'),{rule:'Visit intake',authority:S.family[S.viewer].name,evidence:'Dr. Rajiv Mehta, '+fD(S.now),action:'Prescription extracted and compared against the recording',icon:'steth'});
  notify('meera','New prescription logged — Metformin needs Dr. Mehta’s input on timing');
  notify('neha','A follow-up visit with Dr. Mehta needs booking in about 3 weeks');
  S.visit.createdOnce=true;S.visit.stage='done';openSheet(visitSheetBody());
  toast(t('विज़िट दर्ज हुई','Visit logged'),'check');render();}),

 'checkup:remind:*':(id)=>{const c=S.checkups.find(x=>x.id===id);if(!c)return;c.remindPending=true;render();
  whatsappAdapter.sendReminder(c.assignee,'Routine checkup reminder').then(()=>{c.remindPending=false;

 'checkup:snooze:*':(id)=>{const c=S.checkups.find(x=>x.id===id);if(!c)return;c.due+=3*86400000;c.snoozeCount++;
  logEvent(tb('टेस्ट टाला गया','Checkup snoozed'),{rule:'Self-snooze',authority:S.family[S.viewer].name,evidence:c.title+' · +3 days',action:'Due date moved',icon:'clock'});
  toast(t('3 दिन के लिए टाला गया','Snoozed by 3 days'),'clock');render();},
 'checkup:handoff:*':(id)=>{const c=S.checkups.find(x=>x.id===id);if(!c)return;const to=c.assignee==='meera'?'neha':'meera';
  notify(c.assignee,'Handed off to '+S.family[to].name);notify(to,'You are now handling: '+c.title);
  logEvent(tb('सौंपा गया','Handed off'),{rule:'Caregiver handoff',authority:S.family[S.viewer].name,evidence:c.title+' → '+S.family[to].name,action:'Reassigned',icon:'family'});
  c.assignee=to;toast(t('सौंपा गया: ','Handed off to ')+S.family[to].name.split(' ')[0],'family');render();},
 'checkup:closeflow:*':(id)=>{const c=S.checkups.find(x=>x.id===id);if(!c)return;c.arrangeStage='idle';render();},
 'checkup:advance:*':guard('checkup-advance',(id)=>{const c=S.checkups.find(x=>x.id===id);if(!c)return;
  const order=['booked','assigned','collected','pending','received'];const i=order.indexOf(c.phase);
  if(i<0||i>=order.length-1){render();return;}
  c.phase=order[i+1];c.advancePending=true;
  /* deliberately not blocking the guard on this promise — see refill:advance
     for why holding the lock open across the full round-trip would stall
     the next legitimate 'advance' click instead of just this one. */
  deliveryAdapter.getTracking('AWB').then(()=>{c.advancePending=false;
   logEvent(tb('टेस्ट अपडेट हुआ','Checkup updated'),{rule:'Lab status update',authority:'Lab partner',evidence:c.phase,action:'Status updated',icon:'flask'});
   if(c.phase==='received'){
    c.status='completed';c.wf='EVIDENCED';
    S.labs.chol.r.push([S.now,174]);
    S.docs.unshift({id:uid(),title:c.title+' · '+fD(S.now),cat:'lab',date:S.now,fac:'Metro Diagnostics'});
    S.tasks.push({id:uid(),title:'Review '+c.title.toLowerCase()+' result with Dr. Mehta',owner:'meera',status:'needsaction',agent:{state:'REQUESTED',rule:'New result requires review',authority:'Ramesh',evidence:'Result received, no prior abnormal flag'}});
    notify('neha',c.title+' result is in — a follow-up review task was created');
    logEvent(tb('रिपोर्ट मिल गई','Report received'),{rule:'Result intake',authority:'Metro Diagnostics',evidence:c.title,action:'Follow-up task created',icon:'file'});
   }
   toast(t('अपडेट हुआ','Updated'),'truck');render();});}),

   notify(pid,'Access changed by Ramesh: '+perm+' revoked');

/* resolve "key:arg" and "key:*" patterns */
const CLINICAL_ACT=/^(rec:|records:|trend:|trust:brief|med:|checkup:|visit:|care:findslot|appt:|docappt:|docsearch:|history:tab:trends)/;
function dispatch(key){
 if(S.viewer==='arjun'&&CLINICAL_ACT.test(key)){toast(t('रमेश तय करते हैं कि यह कौन देखेगा।','Ramesh decides who sees this.'),'lock');return;}
 const parts=key.split(':');const base=parts.slice(0,-1).join(':'),arg=parts[parts.length-1];
 if(ACT[key])return ACT[key]();
 const starKey=base+':*';
 if(ACT[starKey])return ACT[starKey](arg);
 // handle multi-arg (e.g. med:setstock:id:n)
 for(let i=1;i<parts.length;i++){
  const b=parts.slice(0,i).join(':')+':*';
  if(ACT[b]){return ACT[b](parts.slice(i).join(':'));}
 }
}

function suPwScore(pw){
 if(!pw)return{s:0,l:t('मज़बूती','Strength')};
 if(pw.length<8)return{s:1,l:t('बहुत छोटा','Too short')};
 if(SU_COMMON.includes(pw.toLowerCase())||/^(.)\1+$/.test(pw))return{s:2,l:t('कमज़ोर','Weak')};
 const p=(pw.length>=12)+(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))+(/\d/.test(pw))+(/[^A-Za-z0-9]/.test(pw));
 return p<=0?{s:2,l:t('कमज़ोर','Weak')}:p<=2?{s:3,l:t('ठीक','Good')}:{s:4,l:t('मज़बूत','Strong')};
}
function suValidate(){

 else if(!id)e.id=t('अपना यूज़र आईडी लिखें।','Enter your user ID.');

  if(SU.pw.length<8)e.pw=t('कम से कम 8 अक्षर रखें।','Use at least 8 characters.');

 if(up&&!SU.agree)e.agree=t('आगे बढ़ने के लिए सहमति दें।','Please agree to continue.');
 return e;

async function suHash(salt,pw){
 try{if(window.crypto&&crypto.subtle){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));
  return 'sha256:'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
 let h=2166136261;const q=salt+':'+pw;for(let i=0;i<q.length;i++){h^=q.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
 return 'fnv:'+h.toString(16);
}
function suSalt(){try{return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return String(Math.random()).slice(2)+Date.now();}}

 S.day.log.push(e);railRender();return e;}

let DAYRUN=0;
function dayWait(ms,run){return new Promise(res=>{let el=0;const iv=setInterval(()=>{
 if(DAYRUN!==run){clearInterval(iv);return res(false);}
 el+=50*(S.day.speed||1);if(el>=ms){clearInterval(iv);res(true);}},50);});}
function dayApply(i,run){
 const d=DAYS[i-1];S.day.n=i;S.now=dayT.apply(null,d.at);
 closeAll();
 S.viewer=d.view;if(d.wa)S.wa.roleView=d.wa;S.tab=d.tab;
 if(i===15)S.money.spent=S.day.base+802;
 if(d.open==='clinic'){S.day.open=false;clinicOpen(true);}else{if(i===15)S.day.open=true;clinicClose(true);}
 addLedger({dayN:i,aud:d.aud,ruleP:d.ruleP?tb(d.ruleP[0],d.ruleP[1]):undefined,title:tb(d.title[0],d.title[1]),rule:tb(d.rule+' · '+RULES[d.rule][0],d.rule+' · '+RULES[d.rule][1]),authority:i===14?'Dr. Mehta':(d.view==='arjun'?'Priya':(d.view==='neha'?'Karan':'Ramesh')),
  evidence:tb(d.what[0],d.what[1]),decision:d.dec,action:'D'+String(i).padStart(2,'0')+' of 16 on 14 Oct',icon:d.icon,conn:d.conn});
 S.ledger[0].t=S.now;
 let k=0;d.calls.forEach(key=>{railCall(key,{dn:i,atMs:S.now+(k++)*1000,delay:1400,amount:802,ref:'saath-pres-0041-14oct'});});
 render();railRender();
 requestAnimationFrame(()=>{const m=d.tab==='voice'?document.querySelector('.vb[data-st="now"]'):d.tab==='whatsapp'?document.querySelector('.watread>:last-child'):null;
  if(m)m.scrollIntoView({block:d.tab==='voice'?'start':'center',behavior:RM?'auto':'smooth'});else window.scrollTo(0,0);});
}
async function dayPlay(){
 if(S.day.playing)return;
 const run=++DAYRUN;
 if(S.day.base==null)S.day.base=S.money.spent;
 if(S.day.restoreNow==null)S.day.restoreNow=S.now;
 S.money.spent=S.day.base;S.ledger=S.ledger.filter(e=>!e.dayN);
 Object.assign(S.day,{touched:true,playing:true,n:0,log:[],open:true,run});
 if($('#app').hidden)enterApp();
 closeAll();window.scrollTo(0,0);railRender();
 for(let i=1;i<=16;i++){
  if(DAYRUN!==run)return;
  dayApply(i,run);
  if(!(await dayWait(DAY_MS,run)))return;
 }
 if(DAYRUN!==run)return;
 S.day.playing=false;S.now=S.day.restoreNow;S.day.restoreNow=null;clinicClose(true);
 S.viewer='meera';S.tab='voice';render();railRender();
 toast(t('दिन पूरा हुआ। 16 फ़ैसले, '+S.day.log.length+' कंसोल एंट्री।','The day is complete. 16 decisions, '+S.day.log.length+' console entries.'),'check');
}
function dayStop(){DAYRUN++;if(!S.day.playing)return;S.day.playing=false;if(S.day.restoreNow!=null){S.now=S.day.restoreNow;S.day.restoreNow=null;}
 clinicClose(true);render();railRender();toast(t('रीप्ले रुका','Replay stopped'),'info');}

Object.keys(RULES).forEach(k=>{HI[k+' · '+RULES[k][1]]=k+' · '+RULES[k][0];});
const HI_MON={Jan:'जन॰',Feb:'फ़र॰',Mar:'मार्च',Apr:'अप्रैल',May:'मई',Jun:'जून',Jul:'जुल॰',Aug:'अग॰',Sep:'सित॰',Sept:'सित॰',Oct:'अक्टू॰',Nov:'नव॰',Dec:'दिस॰'};
const hiDate=x=>x.replace(/\b(\d{1,2}) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sept|Sep|Oct|Nov|Dec)\b/g,(m,d,mo)=>d+' '+HI_MON[mo]).replace(/\b(\d{1,2}:\d{2}) am\b/g,'$1 पूर्वाह्न').replace(/\b(\d{1,2}:\d{2}) pm\b/g,'$1 अपराह्न');
function hiSeg(k){
 if(HI[k])return HI[k];
 if(/^[\d,:\s]*(\d{1,2} [A-Z][a-z]{2,3})/.test(k)&&k.length<40&&!/[a-z]{4,}/.test(k.replace(/Sept|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|am|pm/g,'')))return hiDate(k);
 if(k.indexOf(' · ')>0)return k.split(' · ').map(p=>HI[p]||hiDate(p)).join(' · ');
 if(k.indexOf(', ')>0&&k.length<60){const p=k.split(', ');if(p.some(x=>HI[x]))return p.map(x=>HI[x]||hiDate(x)).join(', ');}
 return k;
}
function hiDom(){
 if(S.lang!=='hi')return;
 ['#view','#sheet','#modal'].forEach(sel=>{const root=$(sel);if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){const raw=n.textContent,k=raw.trim();if(!k||/[ऀ-ॿ]/.test(k)||!/[A-Za-z]/.test(k))continue;
   if(n.parentElement.closest('.tchart,pre,code,[lang=hi]'))continue;
   const h=hiSeg(k);if(h!==k)n.textContent=raw.replace(k,h);}});
}
