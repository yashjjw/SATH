<style>
/* ===== SAATH design language v3 =====
   A family product that keeps records like a form. The app is a warm, quiet
   room; the record is the one cream-coloured thing in it. Blue is ink, not a
   button colour. Red is a stamp. Newsreader is used in five places only
   (the landing headline, screen titles, major titles and names, key figures,
   document titles); everything else is Plex Sans so the interface stays exact.
   Light is the default; dark is charcoal paper with soft blue-grey ink. */
:root{
 --bg:#f1efea; --bg2:#e8e5de; --surface:#ffffff; --surface-2:#f4f2ed; --card:#ffffff;
 --paper:#fff8ea; --paper-rule:#e8dcc4; --paper-margin:#c8381d;
 --ink:#1b1d22; --ink-2:#474b55; --ink-3:#5c606c; --line:#dcd8cf; --line-soft:#e6e2d9; --line-2:#858890;
 --card-edge:var(--line-soft); --hero-bg:var(--card); --alert-bg:var(--card); --chip-edge:30%;
 --brand:#31507f; --brand-2:#263f66; --brand-tint:#e6ebf3; --brand-text:#2a4670;
 --brand-edge:#31507f; --onbrand:#ffffff;
 --o1:#cfd9e8; --o2:#a5b7d3; --o3:#7a93bb; --o4:#51709e; --o5:#31507f;
 --saff:#a85a00; --saff-tint:#fbf0d9; --saff-text:#7a4700;
 --info:#31507f; --info-tint:#e6ebf3; --info-text:#2a4670;
 --jaipur:#5a4a3a; --blr:#31507f;
 --good-fg:#17653a; --good-bg:#e6f3ea; --warn-fg:#7a4700; --warn-bg:#fbf0d9;
 --crit-fg:#b3261e; --crit-bg:#fdeceb; --wait-fg:#474b55; --wait-bg:#ebe9e4;
 --shadow-1:none;
 --shadow-2:0 2px 10px rgba(27,29,34,.12);
 --shadow-3:0 16px 44px rgba(27,29,34,.22),0 2px 6px rgba(27,29,34,.10);
 --paper-shadow:0 1px 2px rgba(70,50,20,.10),0 14px 34px rgba(70,50,20,.10);
 /* Different objects, different corners: chips 4, controls and rows 7,
    cards 8, overlays 12. Circles are for people only. */
 --r-xs:3px; --r-sm:4px; --r-md:7px; --r-lg:8px; --r-xl:12px; --r-pill:5px;
 --fd:'IBM Plex Sans','IBM Plex Sans Devanagari','Noto Sans Devanagari',system-ui,sans-serif;
 --fb:'IBM Plex Sans','IBM Plex Sans Devanagari','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
 --fs:'Newsreader','Noto Serif Devanagari',Georgia,'Times New Roman',serif;
 --fm:'IBM Plex Mono',ui-monospace,monospace;
 --t-1:13px; --t-2:15px; --t-3:17px; --t-4:19px; --t-5:24px; --t-6:30px; --t-7:40px;
 color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#17181c; --bg2:#1d1f24; --surface:#1f2126; --surface-2:#282b32; --card:#1f2126;
 --paper:#2a2620; --paper-rule:#443d31; --paper-margin:#e0735c;
 --ink:#efece6; --ink-2:#c2beb6; --ink-3:#a09c94; --line:#3b3d44; --line-soft:#2e3037; --line-2:#7c7f89;
 --card-edge:var(--line); --hero-bg:var(--card); --alert-bg:var(--card); --chip-edge:40%;
 --brand:#a9bddf; --brand-2:#c3d1ea; --brand-tint:#263349; --brand-text:#bccbe6;
 --brand-edge:#a9bddf; --onbrand:#12202f;
 --o1:#d9e2f1; --o2:#b8c8e2; --o3:#93a9cd; --o4:#7089b3; --o5:#566f99;
 --saff:#f0b25e; --saff-tint:#3a2d14; --saff-text:#f4c785;
 --info:#a9bddf; --info-tint:#263349; --info-text:#bccbe6;
 --jaipur:#d9b28c; --blr:#a9bddf;
 --good-fg:#7bd69f; --good-bg:#183223; --warn-fg:#f4c785; --warn-bg:#3a2d14;
 --crit-fg:#ff9d8a; --crit-bg:#3d2020; --wait-fg:#c2beb6; --wait-bg:#2a2c31;
 --shadow-2:0 2px 10px rgba(0,0,0,.35); --shadow-3:0 16px 44px rgba(0,0,0,.5);
 --paper-shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.35);
 color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#17181c; --bg2:#1d1f24; --surface:#1f2126; --surface-2:#282b32; --card:#1f2126;
 --paper:#2a2620; --paper-rule:#443d31; --paper-margin:#e0735c;

 --card-edge:var(--line); --hero-bg:var(--card); --alert-bg:var(--card); --chip-edge:40%;
 --brand:#a9bddf; --brand-2:#c3d1ea; --brand-tint:#263349; --brand-text:#bccbe6;
 --brand-edge:#a9bddf; --onbrand:#12202f;
 --o1:#d9e2f1; --o2:#b8c8e2; --o3:#93a9cd; --o4:#7089b3; --o5:#566f99;
 --saff:#f0b25e; --saff-tint:#3a2d14; --saff-text:#f4c785;
 --info:#a9bddf; --info-tint:#263349; --info-text:#bccbe6;
 --jaipur:#d9b28c; --blr:#a9bddf;
 --good-fg:#7bd69f; --good-bg:#183223; --warn-fg:#f4c785; --warn-bg:#3a2d14;
 --crit-fg:#ff9d8a; --crit-bg:#3d2020; --wait-fg:#c2beb6; --wait-bg:#2a2c31;
 --shadow-2:0 2px 10px rgba(0,0,0,.35); --shadow-3:0 16px 44px rgba(0,0,0,.5);
 --paper-shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.35);
 color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
/* Restrained wash, not a fintech gradient dashboard: a faint brand-tinted
   glow anchored top-left, gone by 60% of the viewport, sitting on the flat
   --bg everywhere else. */
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-3)/1.55 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:lining-nums}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{letter-spacing:-.018em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:var(--r-xs)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes waveBar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes countPulse{0%{opacity:.3}100%{opacity:1}}
.enter{animation:rise .38s cubic-bezier(.2,.8,.3,1) backwards}
</style>
<style>
.w{max-width:1180px;margin-inline:auto;padding-inline:20px}
/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;font:600 var(--t-2) var(--fb);padding:11px 18px;border-radius:var(--r-pill);min-height:44px;transition:transform .15s cubic-bezier(.2,.8,.3,1),background .15s,box-shadow .15s}
.btn-pri{background:var(--brand);color:#fff}
.btn-pri:hover{background:var(--brand-2);transform:translateY(-1px);box-shadow:var(--shadow-2)}
.btn-sec{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line-2)}
.btn-sec:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn-ghost{color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink)}
.btn-warn{background:var(--crit-bg);color:var(--crit-fg)}
.btn-sm{padding:8px 14px;font-size:var(--t-2);min-height:36px}
.btn-block{width:100%}
.btn:active:not(:disabled),.qa-row button:active,.li:active,.hcard[data-act]:active{transform:scale(.965)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .15s,background .15s}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.92)}
/* ===== loading spin (wired to existing @keyframes spin) ===== */
.spin{animation:spin .8s linear infinite}
.btn[data-loading]{pointer-events:none;opacity:.78}
/* ===== cards =====
   Three deliberate sizes: hero (one big story), md (an action with its own
   CTA), sm (a compact status/number). Borders are kept only where they help
   scanning (list rows); cards lean on shadow + a hint of tonal surface
   contrast instead, so the page reads as layers of whitespace, not boxes. */
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--card-edge);box-shadow:var(--shadow-1);padding:20px;transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s}
.card-pri{background:linear-gradient(165deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border:0;box-shadow:var(--shadow-2)}
.card-pri .muted{color:rgba(255,255,255,.78)}
.card-saff{background:var(--saff-tint);border-color:color-mix(in srgb,var(--saff) 35%,var(--line))}
.card-hero{border-radius:var(--r-lg);padding:26px 24px}
.card-sm{padding:14px 16px;border-radius:var(--r-md)}
.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.micro{display:inline-flex;align-items:center;gap:6px;font:600 var(--t-1) var(--fb);padding:5px 11px;border-radius:var(--r-pill)}
.muted{color:var(--ink-2)}
.ink3{color:var(--ink-3)}
/* ===== number micro-interaction (wired to existing @keyframes countPulse) ===== */
.tnum-bump{animation:countPulse .35s ease-out}
/* ===== empty state ===== */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 20px;color:var(--ink-2)}
.empty .empty-ic{width:52px;height:52px;border-radius:50%;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center}
.empty b{display:block;color:var(--ink);font:600 var(--t-3) var(--fb)}
.empty span{font-size:var(--t-2);max-width:30em}
/* status chips - plain language */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 var(--t-1) var(--fb);padding:5px 11px;border-radius:var(--r-pill);white-space:nowrap}
.st-confirmed{background:var(--good-bg);color:var(--good-fg)}
.st-needsaction{background:var(--saff-tint);color:var(--saff-text)}
.st-waiting{background:var(--wait-bg);color:var(--wait-fg)}
.st-needsapproval{background:var(--saff-tint);color:var(--saff-text)}
.st-onhold{background:var(--crit-bg);color:var(--crit-fg)}
.st-completed{background:var(--good-bg);color:var(--good-fg)}
.st-ontheway{background:var(--brand-tint);color:var(--brand-text)}
.st-cancelled{background:var(--wait-bg);color:var(--ink-3)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
/* ===== app shell ===== */
.app{min-height:100vh;display:flex}
.side{width:244px;flex:none;padding:18px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--surface)}
.side-logo{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
.side-logo b{font-family:var(--fd);font-size:var(--t-4);font-weight:700;color:var(--brand-text)}
.navitem{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);font:600 var(--t-2) var(--fb);color:var(--ink-2);text-align:left}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="page"]{background:var(--brand-tint);color:var(--brand-text)}
.navitem .ic{width:21px;height:21px}
.navmore{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);min-width:0}
.topbar>.seg{min-width:0;flex:none}
.topbar .tsp{flex:1}
.tbtool{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--surface)}
.tbtool:hover{border-color:var(--brand)}
.tbtool b{font-size:var(--t-1);font-weight:700}
.view{padding:22px 24px 90px;max-width:900px;margin-inline:auto}
/* bottom nav (mobile) */
.bnav{display:none}
@media(max-width:860px){
 .side{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
 .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:var(--r-md);font:600 var(--t-1) var(--fb);color:var(--ink-3);min-height:48px}
 .bnav button[aria-current="page"]{color:var(--brand-text)}
 .bnav .ic{width:22px;height:22px}
 .view{padding:16px 16px 100px}
 .topbar{padding:12px 16px;flex-wrap:wrap;gap:8px}
 .topbar .tbtool b,.topbar #agentBtn b{display:none}
 .hideSm{display:none}
}
/* ===== home cards grid ===== */
.greet{padding-block:4px 20px}
.greet h1{font-size:clamp(24px,4.4vw,32px)}
.greet p{color:var(--ink-2);margin-top:6px;font-size:var(--t-3)}
.greet p.attn{color:var(--saff-text);font-weight:600}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.homegrid .span2{grid-column:1/-1}
@media(max-width:560px){.homegrid{grid-template-columns:1fr}.homegrid .span2{grid-column:auto}}
/* medium action card (Home + section pickers) */
.hcard{border-radius:var(--r-lg);padding:19px;display:flex;flex-direction:column;gap:11px;min-height:132px;justify-content:space-between;box-shadow:var(--shadow-1);background:var(--card);border:1px solid var(--card-edge);transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s}
.hcard.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.hcard .hc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hcard .hc-ic{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;flex:none}
.hcard b{font:600 var(--t-4) var(--fd);display:block;letter-spacing:-.01em}
.hcard .hc-sub{font-size:var(--t-2)}
/* hero card: the one story the screen leads with, deliberately larger than
   every other tile so hierarchy reads at a glance */
.hcard.hero{border-radius:var(--r-lg);padding:22px 22px 22px 26px;min-height:148px;gap:14px;background:var(--hero-bg);color:var(--brand-text);border:1px solid color-mix(in srgb,var(--brand) 26%,transparent);position:relative;overflow:hidden}
.hcard.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brand-edge)}
.hcard.hero .hc-sub{color:color-mix(in srgb,var(--brand-text) 78%,var(--ink-2))}
/* The one thing that is actually stuck outranks the one thing that is merely
   scheduled. Apricot, not green, and it sits above the calm card. */
.hcard.alert{border-radius:var(--r-lg);padding:22px 22px 22px 26px;min-height:0;gap:12px;background:var(--alert-bg);color:var(--saff-text);border:1px solid color-mix(in srgb,var(--saff) 32%,transparent);position:relative;overflow:hidden}
.hcard.alert:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--saff)}
.hcard.alert .hc-why{font:600 var(--t-2) var(--fb);color:var(--saff-text);border:1.5px solid color-mix(in srgb,var(--saff) 45%,transparent);border-radius:var(--r-pill);padding:7px 14px;min-height:38px}
.hcard.alert .hc-why:hover{background:color-mix(in srgb,var(--saff) 14%,transparent)}
.hcard.alert b{color:var(--ink)}
.hcard.hero .hc-eyebrow{font:700 var(--t-1) var(--fb);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hcard.hero b{font-size:var(--t-5)}
/* small status tile — a single number/fact, nothing else competing for attention */
.scard{border-radius:var(--r-md);padding:13px 15px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px;min-height:0}
.scard b{font:700 var(--t-4) var(--fb);display:block}
.scard span{font-size:var(--t-1);color:var(--ink-2)}
.qa-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
.qa-row button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:var(--r-md);background:var(--surface-2);font:600 var(--t-1) var(--fb);text-align:center;min-height:44px;transition:transform .15s cubic-bezier(.2,.8,.3,1),background .15s,box-shadow .15s}
.qa-row button:hover{background:var(--brand-tint);color:var(--brand-text);transform:translateY(-2px);box-shadow:var(--shadow-1)}
.qa-row .qi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow-1);transition:transform .15s}
.qa-row button:active .qi{transform:scale(.9)}
@media(max-width:560px){.qa-row{grid-template-columns:repeat(3,1fr);gap:6px}.qa-row button{font-size:var(--t-1);padding:10px 2px}}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.statrow .st{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;transition:transform .15s}
.statrow .st b{display:block;font:700 var(--t-5) var(--fb);margin-top:2px}
.statrow .st span{font-size:var(--t-1);color:var(--ink-2)}
@media(max-width:560px){.statrow{grid-template-columns:repeat(2,1fr)}}
/* ===== sections ===== */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-h h2{font-size:var(--t-4)}
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:var(--r-pill);width:fit-content;margin-bottom:16px}
.tabs button{padding:8px 16px;border-radius:var(--r-pill);font:600 var(--t-2) var(--fb);color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.li{display:flex;align-items:center;gap:13px;padding:14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--card-edge);text-align:left;width:100%;min-height:44px;transition:transform .15s cubic-bezier(.2,.8,.3,1),border-color .15s,box-shadow .15s}
.li:hover{border-color:var(--line-2);box-shadow:var(--shadow-1);transform:translateY(-1px)}
.li-ic{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--brand-text)}
.li-main{flex:1;min-width:0}
.li-t{font-weight:600;font-size:var(--t-3);display:block}
.li-s{font-size:var(--t-2);color:var(--ink-2);display:block;margin-top:2px}
/* A row with a long title plus a trailing chip/button (task & appointment
   rows) gets cramped at phone width — the chip ends up vertically centered
   against 3 wrapped lines of title text. Below 480px, let the row wrap: the
   icon+title stay together on the first line, and chip/button form their
   own line underneath instead of visually colliding with the text. */
@media(max-width:480px){
 .li:has(>.chip),.li:has(>.btn){flex-wrap:wrap;row-gap:8px}
 .li:has(>.chip) .li-main,.li:has(>.btn) .li-main{flex-basis:calc(100% - 55px)}
 .li>.chip,.li>.btn{margin-left:55px}
}
/* ===== progress ring / bar ===== */
.ring{width:72px;height:72px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--brand);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1)}
.pbar{height:8px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:var(--r-pill);transition:width .6s cubic-bezier(.3,.8,.3,1)}
.pbar-dash i{background:repeating-linear-gradient(45deg,var(--brand) 0 6px,color-mix(in srgb,var(--brand) 55%,transparent) 6px 12px)}
.wabubble{max-width:82%;padding:9px 13px;border-radius:var(--r-md);font-size:var(--t-2);line-height:1.45;margin-bottom:8px}
.wabubble.in{background:var(--surface-2);border-top-left-radius:var(--r-xs)}
.wabubble.out{background:var(--brand-tint);color:var(--brand-text);margin-left:auto;border-top-right-radius:var(--r-xs)}
.wabubble .wameta{display:block;font-size:var(--t-1);opacity:.65;margin-top:4px}
.waseg{display:flex;gap:6px;padding:3px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px}
.waseg button{flex:1;border:0;background:none;border-radius:var(--r-pill);padding:8px 6px;font:600 var(--t-2) var(--fb);color:var(--ink-2);cursor:pointer}
.waseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
/* ===== skeleton ===== */
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:var(--r-sm)}
/* ===== stepper / tracker ===== */
.track{display:flex;flex-direction:column;gap:0}
.tstep{display:flex;gap:12px;position:relative;padding-bottom:20px}
.tstep:last-child{padding-bottom:0}
.tstep:before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tstep:last-child:before{display:none}
.tstep.done:before{background:var(--brand)}
.tdot{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-3);z-index:1}
.tstep.done .tdot{background:var(--brand);color:#fff}
.tstep.cur .tdot{background:var(--saff);color:#fff;animation:pop .4s}
.tstep b{display:block;font-size:var(--t-2)}
.tstep span{font-size:var(--t-2);color:var(--ink-2)}
/* ===== waveform / call sheet ===== */
.wave{display:flex;align-items:center;gap:3px;height:40px}
.wave i{width:3.5px;border-radius:var(--r-xs);background:var(--brand);animation:waveBar .9s ease-in-out infinite}
.callhead{display:flex;align-items:center;gap:12px;padding:16px 0}
.callav{width:52px;height:52px;border-radius:50%;background:var(--brand-tint);color:var(--brand-text);display:grid;place-items:center;flex:none}
.calltx{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;font-size:var(--t-2);line-height:1.5;margin-top:4px}
.calltx.me{background:var(--brand-tint)}
/* ===== bottom sheet / modal / toast ===== */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.44);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-radius:var(--r-lg) 20px 0 0;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-3);transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translateY(0)}
.sheet-handle{width:38px;height:4px;border-radius:var(--r-pill);background:var(--line-2);margin:0 auto 14px}
.modal{position:fixed;left:50%;top:8vh;transform:translateX(-50%) scale(.97);width:min(560px,calc(100vw - 32px));max-height:82vh;z-index:80;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-3);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;padding:20px 22px}
.modal.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
.toasts{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px));pointer-events:none}
@media(max-width:860px){.toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r-md);font:500 var(--t-2) var(--fb);box-shadow:var(--shadow-3);animation:rise .25s}
.toast.out{animation:fadeIn .25s reverse}
/* ===== ask bar / command ===== */
.askbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r-pill);padding:6px 8px 6px 18px}
.askbar input{flex:1;border:0;background:none;font:400 var(--t-3) var(--fb);outline:none;color:var(--ink)}
.askbar button{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.chips-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chips-row button{font:500 var(--t-2) var(--fb);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:6px 12px;color:var(--ink-2)}
.chips-row button:hover{border-color:var(--brand);color:var(--brand-text)}
.ansbox{border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px;background:var(--card);margin-top:12px}
.ansbox.ref{border-color:var(--crit-fg);background:var(--crit-bg)}
.ansbox .q{font:600 var(--t-1) var(--fb);color:var(--ink-3);margin-bottom:7px}
.ansbox .a{font-size:var(--t-3);line-height:1.5}
.ansbox .meta{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:var(--t-2)}
.ansbox .meta div{display:grid;grid-template-columns:70px 1fr;gap:10px}
.ansbox .meta k{color:var(--ink-3);font-weight:600}
.fab-ask{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:9px;background:var(--brand);color:#fff;padding:13px 18px;border-radius:var(--r-pill);box-shadow:var(--shadow-3);font:600 var(--t-2) var(--fb)}
@media(max-width:860px){.fab-ask{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
/* agent view drawer */
.agent-row{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:var(--t-2);padding:8px 0;border-bottom:1px solid var(--line)}
.agent-row:last-child{border-bottom:0}
.agent-row k{color:var(--ink-3);font-weight:600}
.agent-row code{font:500 var(--t-1) ui-monospace,monospace;background:var(--surface-2);padding:2px 6px;border-radius:var(--r-xs)}
/* family avatars */
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 var(--t-2) var(--fb);color:#fff}
.av-lg{width:52px;height:52px;font-size:var(--t-4)}
.av-meera{background:#8a5a3a}.av-neha{background:var(--blr)}.av-arjun{background:var(--jaipur)}.av-mehta{background:#5c6b64}
/* city path */
.citypath{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 6px}
.cityend{text-align:center;flex:1}
.cityend b{display:block;font:600 var(--t-3) var(--fd)}
.cityend span{font-size:var(--t-1);color:var(--ink-2)}
.citymid{flex:none;width:70px;height:70px;border-radius:50%;background:var(--brand-tint);color:var(--brand-text);display:grid;place-items:center}
.cityline{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 12px);position:relative;top:-28px}
@media(max-width:560px){.citypath{flex-direction:column}.cityline{display:none}}
/* ===== landing: journey rail (Doctor -> Task -> Call -> Test -> Report -> Follow-up) ===== */
.journey{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:28px 10px 6px;overflow-x:auto}
.jnode{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;flex:1;min-width:64px}
.jnode .jcirc{width:46px;height:46px;border-radius:50%;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center;transition:background .4s,color .4s,transform .4s;flex:none}
.jnode span{font-size:var(--t-1);color:var(--ink-3);font-weight:600;transition:color .4s}
.jnode.active .jcirc{background:var(--brand);color:#fff;transform:scale(1.12);box-shadow:var(--shadow-2)}
.jnode.active span{color:var(--brand-text)}
.jline{flex:0 0 22px;height:2px;background:repeating-linear-gradient(90deg,var(--line-2) 0 5px,transparent 5px 10px);margin-top:-24px}
@media(max-width:700px){.journey{flex-wrap:wrap;justify-content:center}.jline{display:none}}
/* ===== landing: call/pay/deliver story cards ===== */
.storygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.storygrid{grid-template-columns:1fr}}
.storycard .sy-ic{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;margin-bottom:10px}
.storycard .wave{height:26px;margin-top:10px}
.storycard .wave i{width:3px}
/* ===== doctor-visit / compare table ===== */
.cmp{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);font-size:var(--t-2)}
.cmp-row.conflict{background:var(--crit-bg);outline:1.5px solid color-mix(in srgb,var(--crit-fg) 40%,transparent)}
.cmp-row k{display:block;font-size:var(--t-1);font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3);margin-bottom:3px}
.cmp-row.conflict k{color:var(--crit-fg)}
/* ===== provider search card (appointments) ===== */
.provcard{display:flex;flex-direction:column;gap:10px}
.netchip{display:inline-flex;align-items:center;gap:5px;font:600 var(--t-1) var(--fb);padding:3px 9px;border-radius:var(--r-pill)}
.netchip.in{background:var(--good-bg);color:var(--good-fg)}
.netchip.out{background:var(--wait-bg);color:var(--ink-3)}
.netchip.load{background:var(--surface-2);color:transparent;width:70px}
.slotchips{display:flex;flex-wrap:wrap;gap:8px}
.slotchips button{font:600 var(--t-1) var(--fb);padding:8px 13px;border-radius:var(--r-pill);background:var(--brand-tint);color:var(--brand-text);min-height:36px}
.slotchips button:hover{background:var(--brand);color:#fff}

/* --- decision ledger + insights --- */
.whygrid{display:grid;grid-template-columns:132px 1fr;gap:7px 14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:var(--t-2)}
.whygrid k{font:600 var(--t-1) var(--fb);color:var(--ink-3);letter-spacing:.01em}
.whygrid v{color:var(--ink-2);line-height:1.45}
@media(max-width:560px){.whygrid{grid-template-columns:1fr;gap:2px 0}.whygrid k{margin-top:9px}}
.hbar{display:flex;flex-direction:column;gap:4px}
.hbar-row{display:grid;grid-template-columns:minmax(96px,30%) 1fr 56px;align-items:center;gap:12px;min-height:30px}
.hbar-l{font-size:var(--t-2);color:var(--ink-2);text-align:right}
.hbar-t{display:block;height:16px;border-radius:var(--r-xs);background:color-mix(in srgb,var(--ink-3) 13%,transparent);overflow:hidden}
.hbar-t i{display:block;height:100%;border-radius:var(--r-xs)}
.hbar-v{font-size:var(--t-2);text-align:left}
.hbar-note{grid-column:2/3;margin:-1px 0 5px calc(30% + 12px);font-size:var(--t-1);color:var(--saff-text)}
@media(max-width:560px){.hbar-row{grid-template-columns:minmax(78px,38%) 1fr 48px;gap:8px}.hbar-l{font-size:var(--t-1)}.hbar-note{margin-left:0}}

/* The topbar carried four unlabelled circles that wrapped onto a second row on
   a phone. On a product whose primary user is 68, a control either has a word
   next to it or it is not in the way: labels at desktop width, and on a phone
   the whole cluster collapses into Settings, which already holds all three. */
.tbtool .tblabel{font:600 var(--t-2) var(--fb)}
@media(max-width:1100px){.tbtool .tblabel{display:none}}
@media(max-width:720px){
 .topbar #agentBtn,.topbar .tbtool[data-act="theme"],.topbar .tbtool[data-act="lang"]{display:none}
 .topbar{padding:10px 14px;gap:8px}
 .topbar .tbtool[data-act="settings"] .tblabel{display:inline}
}

.av.av-face{background:none!important;color:inherit;padding:0;overflow:hidden;border-radius:50%}
.av.av-face svg{border-radius:50%}

/* Wave 0: in dark mode a filled pill cannot separate from the card behind it
   (measured 1.03:1), so every filled token surface carries a hairline drawn
   from its own foreground. At --chip-edge:0% this is a no-op in light mode. */
.chip,.micro{border:1px solid color-mix(in srgb,currentColor var(--chip-edge),transparent)}
.statrow .st,.scard{border:1px solid var(--card-edge)}
.tabs{border:1px solid var(--card-edge)}
.tabs button[aria-pressed="true"]{box-shadow:var(--shadow-1)}
.askbar,.tbtool,.chips-row button{border-color:var(--line-2)}
.hbar-t{background:color-mix(in srgb,var(--ink-3) 18%,transparent)}

/* ---------- the evidence plane ----------
   The product's whole argument is that every action carries its own paperwork,
   so paperwork is the one place the design raises its voice. Evidence surfaces
   are NOT the soft rounded cards the rest of the app uses: they are documents.
   Near-square corners, a ruled margin like a clinic form, no shadow, and
   transcribed source text set in mono so a quotation reads as a quotation. */
.doc{background:var(--paper);border:1px solid var(--paper-rule);border-left:3px solid var(--dtone,var(--ink-3));
 border-radius:var(--r-xs);box-shadow:none;padding:20px 24px 20px 22px;position:relative}
.doc .doc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.doc .doc-t{display:flex;align-items:center;gap:11px;min-width:0}
.doc .doc-i{width:32px;height:32px;border-radius:var(--r-xs);display:grid;place-items:center;flex:none;
 background:color-mix(in srgb,var(--dtone) 14%,transparent);color:var(--dtone)}
.doc h4{font:650 var(--t-4)/1.25 var(--fd);letter-spacing:-.02em}
.whygrid{display:grid;grid-template-columns:124px 1fr;gap:0;margin-top:16px;padding-top:14px;
 border-top:1px solid var(--paper-rule);font-size:var(--t-2);position:relative}
.whygrid:after{content:"";position:absolute;left:110px;top:0;bottom:4px;width:1px;
 background:color-mix(in srgb,var(--paper-margin) 38%,transparent)}
.whygrid k{font:500 var(--t-1)/1.5 var(--fb);color:var(--ink-3);padding:6px 18px 6px 0;letter-spacing:.012em}
.whygrid v{color:var(--ink-2);line-height:1.5;padding:6px 0 6px 14px}
.whygrid v.quote{font-family:var(--fm);font-size:var(--t-2);color:var(--ink);letter-spacing:-.01em}
@media(max-width:600px){.whygrid{grid-template-columns:1fr;gap:0}.whygrid:after{display:none}
 .whygrid k{padding:10px 0 0}.whygrid v{padding:2px 0 0}}
/* ---------- the stamp ----------
   A terminal state is not a pill. It is something a person pressed onto paper,
   and it carries the rule and the date the way a real one does. One bold thing
   in the whole system; everything around it stays quiet. */
.stamp{flex:none;transform:rotate(-2.4deg);transform-origin:center;opacity:.92;margin:-2px -2px 0 0}
.stamp text{font-family:var(--fd);font-weight:700;fill:var(--dtone)}
@media(max-width:620px){.stamp{display:none}}

/* The all-caps tracked eyebrow is gone. Its job was to name the card, and the
   Devanagari line does that better: it names it AND it stays useful to the
   person this product is actually for, instead of being toggled away. */
.hc-hi{display:block;margin-top:6px;font:500 var(--t-1)/1.3 'Noto Sans Devanagari',var(--fb);color:var(--ink-3);letter-spacing:.012em}

/* ---- fixes pass: landing hero document, payer lock, mobile more ---- */
.herogrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:44px;align-items:center}
@media(max-width:860px){.herogrid{grid-template-columns:1fr;gap:28px}}
.herocap{font:600 var(--t-1) var(--fb);color:var(--ink-3);margin:0 0 8px 2px;letter-spacing:.01em}
.lockpanel{background:var(--paper);border:1px dashed var(--line-2);border-radius:var(--r-xs);padding:26px 24px;display:flex;gap:16px;align-items:flex-start}
.lockpanel .lk{width:40px;height:40px;border-radius:var(--r-xs);display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.lockpanel b{display:block;font:650 var(--t-4) var(--fd);letter-spacing:-.015em}
.lockpanel p{color:var(--ink-2);margin-top:6px;font-size:var(--t-3);max-width:46ch}
.doc.compact{padding:16px 18px 16px 18px}
@media(max-width:560px){#landing>header .hdr-how{display:none}#landing>header .btn-pri{white-space:nowrap}}
.doc .whygrid.tight{margin-top:12px;padding-top:10px}

/* =====================================================================
   DESIGN LANGUAGE v2: components
   Structure comes from hairlines and type, not from shadows and fills.
   One small radius family, no pills, no hover lift, one accent (ink blue),
   one loud thing (the red stamp).
   ===================================================================== */
/* ---- type ---- */
.greet h1{font-size:clamp(30px,5vw,40px);line-height:1.05;letter-spacing:-.018em}
.greet p{font-size:var(--t-3)}
.greet p.attn{color:var(--ink);font-weight:600}
.greet p.attn:before{content:"";display:inline-block;width:9px;height:9px;background:var(--saff);margin-right:9px;border-radius:2px;transform:translateY(-1px)}
.sec-h{margin:34px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);align-items:center}
.sec-h h2{font:600 var(--t-4)/1.2 var(--fd);letter-spacing:-.005em}
.tnum,.hcard,.statrow,.st,.li,.chip,.micro,.whygrid{font-variant-numeric:tabular-nums lining-nums}
/* ---- buttons ---- */
.btn{border-radius:var(--r-md);font-weight:600;transition:background .12s,border-color .12s,color .12s}
.btn-pri{background:var(--brand);color:var(--onbrand)}
.btn-pri:hover{background:var(--brand-2);transform:none;box-shadow:none}
.btn-sec{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn-sec:hover{border-color:var(--ink);transform:none}
.btn-ghost{color:var(--brand-text)}
.btn-ghost:hover{color:var(--brand-text);text-decoration:underline;text-underline-offset:3px}
.btn-warn{background:var(--surface);color:var(--crit-fg);border:1px solid var(--crit-fg)}
.btn-warn:hover{background:var(--crit-bg)}
.btn:active:not(:disabled),.qa-row button:active,.li:active,.hcard[data-act]:active{transform:none;filter:brightness(.96)}
.iconbtn{border-radius:var(--r-md)}
/* ---- surfaces ---- */
.card{border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:none;background:var(--card)}
.card-pri{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.card-pri .muted{color:color-mix(in srgb,var(--onbrand) 82%,transparent)}
.card-saff{background:var(--saff-tint);border-color:color-mix(in srgb,var(--saff) 40%,var(--line))}
.card-hero{border-radius:var(--r-lg)}
.card-sm{border-radius:var(--r-md)}
.lift:hover,.hcard.lift:hover{transform:none;box-shadow:none;border-color:var(--ink-3)}
.hcard{border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:none;min-height:0;padding:18px 20px;gap:12px}
.hcard b{font:600 var(--t-4)/1.25 var(--fd);letter-spacing:-.005em}
.hcard .hc-sub{font-size:var(--t-2)}
.hcard .hc-ic,.li-ic,.sy-ic{width:38px;height:38px;border-radius:var(--r-md);background:var(--surface-2)!important;color:var(--ink-2)!important}
.hcard.hero{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--brand);padding:22px 24px;gap:14px}
.hcard.hero:before,.hcard.alert:before{display:none}
.hcard.hero b{font-size:var(--t-5);line-height:1.15}
.hcard.hero .hc-sub{color:var(--ink-2)}
.hcard.hero .hc-ic{color:var(--brand)!important}
.hcard.alert{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--saff);padding:20px 24px;gap:12px}
.hcard.alert b{font-size:var(--t-5);line-height:1.15;color:var(--ink)}

/* ===================== the day: voice rail, clinic screen, rail console =====================
   Built from the existing tokens only. In dark mode these surfaces separate by
   border and rule, never by a new fill. */
.rsv-note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:11px 14px;border:1px solid color-mix(in srgb,var(--good-fg) 45%,var(--line));border-left:3px solid var(--good-fg);border-radius:var(--r-xs);font:600 var(--t-2)/1.45 var(--fb);color:var(--ink)}
.rsv-note .ic{width:18px;height:18px;flex:none;margin-top:2px;color:var(--good-fg)}
/* who is told what */
.split{margin-bottom:14px}
.split-g{display:grid;gap:0;margin-top:12px}
.split-r{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.split-r b{font:600 var(--t-2) var(--fb)}
.split-r p{margin:2px 0 0;color:var(--ink-2);font-size:var(--t-2);line-height:1.45}
.split-f{display:flex;gap:9px;align-items:center;margin:4px 0 0;padding-top:11px;border-top:1px solid var(--line);font:600 var(--t-2) var(--fb);color:var(--ink)}
.split-f .ic{width:16px;height:16px;flex:none}
/* voice view */
.hands{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hands li{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.hands li.on{border-color:var(--brand)}
.hands .hn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;font:600 var(--t-1) var(--fb);color:var(--ink-2)}
.hands li.on .hn{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.hands b{display:block;font:600 var(--t-2) var(--fb)}
.hands li>div>span{display:block;margin-top:2px;font-size:var(--t-1);color:var(--ink-2)}
@media(max-width:700px){.hands{grid-template-columns:1fr}}
.held-i{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.held-i .ic{width:15px;height:15px;flex:none;margin-top:4px;color:var(--good-fg)}
.vtl{border-left:1px solid var(--line-2);margin-left:7px;padding-left:22px;display:grid;gap:18px}
.vb{position:relative;scroll-margin-top:90px}
.vb:before{content:"";position:absolute;left:-29px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.vb[data-st="done"]:before{background:var(--brand);border-color:var(--brand)}
.vb[data-st="now"]:before{border-color:var(--brand);background:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 28%,transparent)}
.vb[data-st="next"] h3{color:var(--ink-3)}
.vb-t{font:600 var(--t-1) var(--fm);color:var(--ink-2)}
.vb h3{font:650 var(--t-3)/1.3 var(--fd);margin:2px 0 0;letter-spacing:-.01em}
.vb h3.sm{font:600 var(--t-2)/1.35 var(--fb)}
.vb-p{font-size:var(--t-2);color:var(--ink-2);margin:6px 0 0;line-height:1.5}
.vcard{margin-top:10px;padding:16px 18px}
.conf{display:grid}
.conf-r{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.conf-r:first-child{border-top:0;padding-top:0}
.conf-r span{font:500 var(--t-2) var(--fm);color:var(--ink)}
.conf-r b{font:600 var(--t-5)/1 var(--fd)}
.conf-r em{grid-column:1/-1;font-style:normal;font-size:var(--t-1);color:var(--ink-2)}
.conf-r.low b{color:var(--saff-text)}
.vb-why{margin:12px 0 0;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--saff);border-radius:var(--r-xs);font:650 var(--t-3)/1.4 var(--fd);color:var(--ink)}
.rmark{display:inline-flex;gap:6px;align-items:center;font:600 var(--t-1) var(--fb);color:var(--good-fg);border:1px solid color-mix(in srgb,var(--good-fg) 45%,var(--line));padding:4px 10px;border-radius:var(--r-pill)}
.rmark .ic{width:14px;height:14px}
.vquote{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--brand);font:500 var(--t-3)/1.5 var(--fd);color:var(--ink)}

.cmp{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:12px 0 0;padding:12px 14px;border:1px solid var(--paper-rule);background:var(--paper);border-radius:var(--r-xs);font-size:var(--t-2)}
.cmp dt{color:var(--ink-3);font-size:var(--t-1);padding-top:2px}

.vb-note{display:flex;gap:9px;align-items:flex-start;margin:12px 0 0;padding:10px 12px;border:1px dashed var(--line-2);border-radius:var(--r-md);font:600 var(--t-2)/1.45 var(--fb);color:var(--ink)}
.vb-note .ic{width:16px;height:16px;flex:none;margin-top:3px}
/* day entries inside the WhatsApp simulation */
.wanote{display:flex;gap:9px;align-items:flex-start;margin:4px auto 10px;padding:9px 12px;border:1px dashed var(--line-2);border-radius:var(--r-md);font-size:var(--t-1);line-height:1.45;color:var(--ink)}

.wabubble.wacmp{max-width:94%;background:var(--paper);border:1px solid var(--paper-rule)}

/* the clinician surface: a different screen, not a tab of the family app */
#clinic{position:fixed;inset:0;z-index:55;overflow:auto;background:var(--bg);padding-bottom:calc(var(--rcon-h,0px) + 32px)}

.ln-st{position:relative;padding-top:22px;padding-right:6px;min-width:0}
.ln-st:before{content:"";position:absolute;top:6px;left:7px;right:-7px;height:2px;background:var(--line)}
.ln-st:last-child:before{display:none}
.ln-st.on:before{background:var(--brand)}
.ln-dot{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);background:var(--card);z-index:1}
.ln-st.on .ln-dot{background:var(--brand);border-color:var(--brand)}
.ln-l{display:block;font:600 var(--t-1) var(--fb);color:var(--ink)}
.ln-st:not(.on) .ln-l{color:var(--ink-3);font-weight:500}
.ln-t,.ln-d{display:block;font-size:var(--t-1);color:var(--ink-3)}
.ln-wait{margin-top:12px;font-size:var(--t-2);color:var(--saff-text)}
.sg{display:grid;grid-template-columns:minmax(120px,2.2fr) repeat(var(--c),1fr);align-items:center;gap:0;border-top:1px solid var(--line)}
.sg>*{padding:8px 4px;border-bottom:1px solid var(--line-soft);font-size:var(--t-1);min-height:40px;display:flex;align-items:center}
.sg>b{justify-content:center;color:var(--ink-3);font-weight:600}
.sg-r{color:var(--ink-2);font-size:var(--t-1)}
.sg-c{justify-content:center;gap:4px}
.sg-d{width:12px;height:12px;border-radius:50%;background:var(--ink);display:inline-block}
.sg-c em{font-style:normal;color:var(--ink-2)}
.stp{border:1px solid var(--card-edge);border-radius:var(--r-md);padding:12px 14px;background:var(--card)}
.hd-g{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}

.hd-h{display:block;font:600 var(--t-1) var(--fb);color:var(--ink-3);margin-bottom:4px}
.hd-g ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hd-g li{display:flex;gap:8px;align-items:flex-start;font-size:var(--t-2)}
.hd-g li .ic{width:16px;height:16px;margin-top:3px}
.tc-axl{stroke:var(--line-2);stroke-width:1}
.tc-step{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:miter}
.tc-today{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}

/* ---- v10: trend chart. Everything is drawn from existing tokens, by stroke and border, never by new fills. ---- */
.tchart{position:relative}
.tc-svg{display:block;max-width:100%;overflow:visible}
.tc-ax{font:400 var(--t-1) var(--fb);fill:var(--ink-3)}
.tc-band{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
.tc-curve{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.tc-dot{fill:var(--card);stroke:var(--brand);stroke-width:2}
.tc-dot.flag{fill:var(--ink);stroke:var(--ink)}
.tc-flag{font:700 var(--t-1) var(--fb);fill:var(--ink)}
.tc-hit{fill:transparent;stroke:none}
.tc-ring{fill:none;stroke:var(--brand);stroke-width:2.5;opacity:0}
.tpt{cursor:pointer;outline:none}
.tpt:hover .tc-dot{stroke-width:3.2}
.tpt:focus-visible .tc-ring{opacity:1}

/* ===================== canonical execution workflow state =====================
   Technical vocabulary for Agent View only. Every execution task, appointment,
   checkup and refill carries one of these; Family View never sees them directly —
   it only ever reads the plain `status` field (STATUS map above), which this
   table reduces onto. Many technical states fold into the same plain label,
   which is expected: the 11-state machine is for auditability, the 7-label set
   is for a person who just wants to know what is happening. */
const WF={REQUESTED:'REQUESTED',WAITING:'WAITING',SCHEDULED:'SCHEDULED',ACCEPTED:'ACCEPTED',
 EXECUTED:'EXECUTED',EVIDENCED:'EVIDENCED',CLOSED:'CLOSED',BLOCKED:'BLOCKED',
 NEEDS_APPROVAL:'NEEDS_APPROVAL',NEEDS_CLARIFICATION:'NEEDS_CLARIFICATION',CANCELLED:'CANCELLED'};
const WF_PLAIN={REQUESTED:'needsaction',WAITING:'waiting',SCHEDULED:'booked',ACCEPTED:'booked',
 EXECUTED:'completed',EVIDENCED:'completed',CLOSED:'completed',BLOCKED:'onhold',
 NEEDS_APPROVAL:'needsapproval',NEEDS_CLARIFICATION:'onhold',CANCELLED:'cancelled'};
function wfChip(wf){return chip(WF_PLAIN[wf]||'waiting')}

/* one call site for anything that should leave a trace in the shared history/
   decision ledger — every consequential action in the app should call this
   (or addLedger directly for the two pre-existing call sites) so nothing
   changes state silently. */
function logEvent(title,opts){opts=opts||{};addLedger({aud:opts.aud,title,rule:opts.rule||'—',authority:opts.authority||'SAATH',
 evidence:opts.evidence||'',decision:opts.decision||'LOGGED',action:opts.action||title,icon:opts.icon||'info'})}
function notify(to,text){S.notifications.unshift({id:uid(),to,text,t:S.now,read:false})}

/* ===================== Ask SAATH: clinical gate + records Q&A ===================== */
const GATE=[
 /\b(should|shall|must)\s+(i|she|he|we|meera)\b/i,/\bchahiye\b/i,
 /\b(is|are|was)\s+.*\b(low|high|normal|abnormal|bad|good|dangerous|serious|safe|ok|okay|fine|healthy)\b/i,
 /\b(low|high|normal|abnormal)\b.*\?/i,/\bkam hai\b|\bzyada hai\b|\btheek hai\b/i,
 /\bwhat (does|do) .*(mean|indicate|suggest)\b/i,/\bmatlab kya\b/i,
 /\b(diagnos|prognos|symptom|disease|condition|illness|cure|treat|treatment|therapy|side ?effect|interaction|contraindicat)/i,
 /\b(skip|miss|missed|stop|stopping|double|half|increase|reduce|adjust)\b.*\b(dose|tablet|medicine)\b/i,
 /\b(dose|dosage|how many tablets)\b/i,/\bwhich (medicine|drug|is better|doctor|hospital)\b/i,
 /\b(risk|chances|likelihood|probability) of\b/i,/\bam i\b.*\b(ok|fine|healthy|sick)\b/i,
 /\bworr(y|ied)|\bconcern(ed|ing)?\b|\bserious\b/i,/\b(better|worse|improv|deteriorat)/i
];
const isClinical=q=>GATE.some(r=>r.test(q));

/* Answers about readings and open tasks are built from the data, so they can never go out of step with the charts. */
const NUMW=['no','one','two','three','four','five','six','seven','eight','nine','ten'];
function labAnswer(key){
 const l=S.labs[key],n=l.r.length,last=l.r[n-1],first=l.r[0];
 const doc=last[3]&&S.docs.find(d=>d.id===last[3]);
 const band=key==='bp'?'No reference range is printed on a BP slip, so none is shown.':'Printed range: '+l.band.replace(' (printed on report)','')+'.';
 const a=(n>1?(NUMW[n]||n)[0].toUpperCase()+(NUMW[n]||String(n)).slice(1)+' readings from '+fDY(first[0])+' to '+fDY(last[0])+'. ':'One reading: ')+'Latest: '+last[1]+(key==='bp'?'':' '+l.u)+' on '+fD(last[0])+'. '+band+(last[2]?' The lab marked the latest one '+last[2]+'.':'');
 const next=n>=3?'Every reading is a dot. The line joins them.':n===2?'Two points are shown as dots, not a line.':'A single reading is shown as a number, not a chart.';
 return{a:a,src:doc?doc.title:'clinic slips',next:key==='hb'||key==='sugar'?'What this means is for Dr. Mehta. '+next:next};
}
function openTasksAnswer(){
 const own=x=>x.owner==='mehta'?'Dr. Mehta’s clinic':S.family[x.owner]?S.family[x.owner].name.split(' ')[0]:x.owner;
 const open=S.tasks.filter(isOpenTask);
 return{a:(NUMW[open.length]?NUMW[open.length][0].toUpperCase()+NUMW[open.length].slice(1):open.length)+' thing'+(open.length===1?' is':'s are')+' open: '+open.map(x=>x.title.replace(/^Approve /,'the ')+' ('+own(x)+')').join(', ')+'.',src:'open tasks',next:'Each names exactly one owner.'};
}
function ans(q){
 const s=q.toLowerCase();const has=(...w)=>w.some(x=>s.includes(x));
 if(isClinical(q))return{ref:1};
 if(has('prescription','wrote','written','mehta'))
  return{a:'Dr. Mehta wrote four things on 12 Oct 2026: Telmisartan 40&nbsp;mg each morning after breakfast, Amlodipine 5&nbsp;mg (timing unclear), Vitamin D weekly, and a CBC test by Saturday.',src:'prescription_12oct.jpg',next:'The Amlodipine timing is disputed and only Dr. Mehta can settle it.'};
 if(has('hb','haemoglobin','hemoglobin'))
  return labAnswer('hb');
 if(has('sugar','glucose'))
  return labAnswer('sugar');
 if(has('cholesterol','lipid'))
  return labAnswer('chol');
 if(has('bp','blood pressure','pressure'))
  return labAnswer('bp');
 if(has('pending','open','to do','what needs','what is still'))
  return openTasksAnswer();
 if(has('blocked','stopped','on hold','why'))
  return{a:'Two things are stopped: the Amlodipine reminder (recording says evening, prescription says morning) and one refill (the pack carried an extra molecule).',src:'decision ledger',next:'Neither can be cleared by the family or by SAATH.'};
 if(has('appointment','next visit','dr','doctor visit'))
  return{a:'The next appointment is with Dr. Rajiv Mehta, '+fDT((S.appts.find(a=>a.stage==='upcoming')||{when:S.now}).when)+', Mehta Clinic.',src:'appointments',next:'Open Care → Appointments for details.'};
 if(has('spend','spent','money','cost','month'))
  return{a:inr(S.money.spent)+' utilised of the '+inr(S.money.reserve)+' reserve Priya blocked in her own bank account. '+inr(reserveLeft())+' remaining, '+S.money.daysLeft+' days left to run. '+inr(S.money.limit)+' is the per-order limit before Priya must approve.',src:'payment ledger',next:'One request is waiting on Priya now.'};
 if(has('arjun'))
  return{a:'Priya can approve medicine purchases and see receipts. She cannot see prescriptions, reports or the medicine schedule.',src:'permission ledger',next:'Only Ramesh can change this.'};
 if(has('neha'))
  return{a:'Karan can view reports, manage appointments and upload records. He cannot approve payments.',src:'permission ledger',next:'Set to expire 31 Dec 2026.'};
 if(has('insurance','covered','network','claim'))
  return{a:'Your policy covers ₹10 lakh, renews 12 Jan. '+S.insurance.claims+' claims on file.',src:'uploaded policy',next:'Ask about a specific doctor or procedure for a grounded answer.'};
 if(has('document','record','how many','coverage','history'))
  return{a:S.docs.length+' documents on file: prescriptions, lab reports and one discharge summary. Oldest from 20 Jun 2026.',src:'record library',next:'Nothing before that date exists here.'};
 if(has('dose','took','taken','confirm'))
  return{a:'Whether a dose was taken is shown to Ramesh only. No permission level unlocks it for anyone else.',src:'reminder rules',next:'A caregiver is told a task is unconfirmed, never what a person did.'};
 return null;
}
function ansBox(q){

 if(r&&r.ref)return '<div class="ansbox ref"><div class="q">'+ic('alert')+' SAATH will not answer this</div><div class="a">This asks what a value or medicine <i>means</i> &mdash; a doctor’s answer, not ours.</div><div class="meta"><div><k>Can do</k><span>Show the value and the printed range, with its date and source.</span></div><div><k>Why</k><span>A coordination agent that guesses at clinical meaning is the thing families should not trust.</span></div></div></div>';

/* ===================== permission expiry ===================== */
/* A permission is active only while it exists in f.can AND (expiresAt is
   'never' or still in the future) AND the person has not hit "Stop sharing".
   Anything that gates an action on a permission must call this, not read
   f.can directly, so an expired grant is auto-treated as revoked without a
   separate sweep step. */
function isPermActive(personId,permText){
 const f=S.family[personId];if(!f||f.stopped)return false;
 const g=(f.can||[]).find(c=>(c.text||c)===permText);if(!g)return false;
 if(g.expiresAt==='never'||g.expiresAt==null)return true;
 return g.expiresAt>S.now;
}

/* ===================== WhatsApp simulator wiring =====================
   Single call site: every reminder/escalation/approval-request/delivery-
   update that should show up in a role's simulated WhatsApp thread goes
   through here, which both logs the simulated message to S.wa.threads[to]
   (so VIEWS.whatsapp in 23-views-family-more.js renders it) and calls the
   real whatsappAdapter method so the adapter layer stays the single place
   that "sends" anything. A person who hit Stop Sharing gets nothing new. */
function waSend(to,text,opts){
 opts=opts||{};
 const f=S.family[to];if(!f||f.stopped)return Promise.resolve({ok:false,blocked:true});
 const call=opts.method==='interactive'?whatsappAdapter.sendInteractiveMessage(to,text,opts.buttons||[]):
  opts.method==='document'?whatsappAdapter.sendDocument(to,{title:text}):
  opts.method==='caregiver'?whatsappAdapter.sendCaregiverUpdate(to,text):
  whatsappAdapter.sendMessage(to,text);
 return call.then(r=>{
  S.wa.threads[to].push({id:uid(),dir:'in',text,t:S.now,icon:opts.icon||'phone',kind:opts.kind||'message'});
  return r;
 });
}

/* ===================== pack-photo verification classifier =====================
   Deterministic — no AI "judgement" about safety. Takes the medicine's own
   expected composition (m.comp, an array of {name,mg}) and a simulated
   "extracted" pack label, and returns exactly one of 8 structural outcomes.
   Never says safe/unsafe; only states what differs and who is authorised
   to resolve it (the UI layer reads `outcome.authority`). */
function classifyPackPhoto(medicineId,extraction){
 const m=S.meds.find(x=>x.id===medicineId);
 if(!m)return{outcome:'unreadable',label:'Unreadable panel',detail:'Medicine not found.',authority:'Pharmacist'};
 if(extraction.confidence!=null&&extraction.confidence<0.5)
  return{outcome:'unreadable',label:'Unreadable panel',
   detail:'The pack text extracted with low confidence and cannot be compared reliably.',authority:'Pharmacist or prescriber'};
 const mols=extraction.molecules||[]; // [{name,mg}]
 if(extraction.ratioOnly)
  return{outcome:'ratio_no_names',label:'Ratio given without molecule names',
   detail:'The pack shows a strength ratio ('+extraction.ratioOnly+') but no molecule names, so it cannot be compared to the prescribed composition.',authority:'Pharmacist'};
 const expected=m.comp;
 const byName=n=>mols.find(x=>x.name.toLowerCase()===n.toLowerCase());
 const missing=expected.filter(e=>!byName(e.name));
 const extra=mols.filter(pm=>!expected.some(e=>e.name.toLowerCase()===pm.name.toLowerCase()));
 const strengthDiff=expected.filter(e=>byName(e.name)&&byName(e.name).mg!==e.mg);
 /* duplicate / stopped checks run against the extra molecules (or, for a
    demo fixture, an explicit extraction.demoDupWith/demoStoppedWith id so
    every outcome is reachable without a second active medicine sharing a
    molecule already existing in the seed data). */
 if(extraction.demoStoppedWith){const s2=S.meds.find(x=>x.id===extraction.demoStoppedWith);
  if(s2)return{outcome:'stopped',label:'Stopped medicine',
   detail:'The pack matches '+s2.name+', a medicine whose status is already on hold.',authority:'Prescriber'};}
 if(extraction.demoDupWith){const d2=S.meds.find(x=>x.id===extraction.demoDupWith);
  if(d2)return{outcome:'duplicate',label:'Duplicate active medicine',
   detail:'Another active medicine ('+d2.name+') already contains the same active molecule. Taking both together was not instructed anywhere on file.',authority:'Prescriber'};}
 if(extra.length){
  const stopHit=S.meds.find(x=>x.status==='onhold'&&x.id!==m.id&&extra.some(pm=>x.comp.some(ec=>ec.name.toLowerCase()===pm.name.toLowerCase())));
  if(stopHit)return{outcome:'stopped',label:'Stopped medicine',
   detail:'The pack contains '+extra.map(x=>x.name).join(', ')+', matching '+stopHit.name+', a medicine whose status is already on hold.',authority:'Prescriber'};
  const dupHit=S.meds.find(x=>x.status==='active'&&x.id!==m.id&&extra.some(pm=>x.comp.some(ec=>ec.name.toLowerCase()===pm.name.toLowerCase())));
  if(dupHit)return{outcome:'duplicate',label:'Duplicate active medicine',
   detail:'The pack contains '+extra.map(x=>x.name).join(', ')+', which '+dupHit.name+' (also active) already provides.',authority:'Prescriber'};
  if(!missing.length)return{outcome:'extra',label:'Extra molecule',
   detail:'The pack contains '+extra.map(x=>x.name+' '+x.mg+'mg').join(', ')+' in addition to the prescribed composition for '+m.name+'.',authority:'Prescriber or pharmacist'};
 }
 if(missing.length&&!extra.length)
  return{outcome:'missing',label:'Missing molecule',
   detail:'The pack is missing '+missing.map(x=>x.name+' '+x.mg+'mg').join(', ')+', part of the prescribed composition for '+m.name+'.',authority:'Prescriber or pharmacist'};
 if(strengthDiff.length)
  return{outcome:'strength',label:'Strength mismatch',
   detail:strengthDiff.map(x=>x.name+': pack shows '+byName(x.name).mg+'mg, prescribed '+x.mg+'mg').join('; ')+'.',authority:'Prescriber or pharmacist'};
 if(!missing.length&&!extra.length&&!strengthDiff.length)
  return{outcome:'exact',label:'Exact match',
   detail:'Pack composition matches the prescribed composition for '+m.name+' exactly.',authority:null};
 return{outcome:'extra',label:'Extra molecule',
  detail:'The pack composition does not line up with what is prescribed for '+m.name+'.',authority:'Prescriber or pharmacist'};
}

/* ===================== Records: real search/filter parsing =====================
   Turns free text like "CBC report from 14 October" or "reports from August"
   into actual filter criteria, then filters S.docs for real — no canned
   result strings. Combines (AND) with the chip filters in S.recFilters. */
const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
function parseRecordQuery(q){
 const s=(q||'').toLowerCase();const crit={};
 const monthIdx=MONTHS.findIndex(m=>s.includes(m)||s.includes(m.slice(0,3)));
 if(monthIdx>-1)crit.month=monthIdx+1;
 const dayMatch=s.match(/\b(\d{1,2})(st|nd|rd|th)?\b/);
 if(dayMatch&&monthIdx>-1)crit.day=+dayMatch[1];
 const yearMatch=s.match(/\b20\d{2}\b/);if(yearMatch)crit.year=+yearMatch[0];
 ['rx','prescription'].some(w=>s.includes(w))&&(crit.docType='rx');
 ['lab','report','test'].some(w=>s.includes(w))&&!crit.docType&&(crit.docType='lab');
 ['discharge'].some(w=>s.includes(w))&&(crit.docType='dis');
 if(s.includes('cbc'))crit.testType='CBC';
 if(s.includes('lipid')||s.includes('cholesterol'))crit.testType='Lipid profile';
 if(s.includes('glucose')||s.includes('sugar'))crit.testType='Fasting glucose';
 if(s.includes('mehta'))crit.doctorId='mehta';
 if(s.includes('metro'))crit.lab='Metro Diagnostics';
 if(s.includes('apollo'))crit.lab='Apollo Diagnostics';
 if(s.includes('sunrise'))crit.hospital='Sunrise Hospital';
 Object.keys(S.meds).length&&S.meds.forEach(m=>{if(s.includes(m.name.toLowerCase()))crit.medicineId=m.id;});
 return crit;
}
function filterDocs(crit,extra){
 crit=crit||{};extra=extra||{};
 return S.docs.filter(d=>{
  if(crit.docType&&d.docType!==crit.docType)return false;
  if(crit.testType&&d.testType!==crit.testType)return false;
  if(crit.doctorId&&d.doctorId!==crit.doctorId)return false;
  if(crit.lab&&d.lab!==crit.lab)return false;
  if(crit.hospital&&d.hospital!==crit.hospital)return false;
  if(crit.medicineId&&(!d.linkedMedicineIds||d.linkedMedicineIds.indexOf(crit.medicineId)<0))return false;
  if(crit.year||crit.month||crit.day){
   const dd=new Date(d.date);
   if(crit.year&&dd.getFullYear()!==crit.year)return false;
   if(crit.month&&dd.getMonth()+1!==crit.month)return false;
   if(crit.day&&dd.getDate()!==crit.day)return false;
  }
  if(extra.doctor&&d.doctorId!==extra.doctor)return false;
  if(extra.lab&&d.lab!==extra.lab&&d.hospital!==extra.lab)return false;
  if(extra.month&&(new Date(d.date)).getMonth()+1!==extra.month)return false;
  return true;
 });
}
/* duplicate detection: same testType + same calendar date (or within 1 day)
   as an existing doc already on file */
function findDuplicateDoc(ex){
 if(!ex.testType)return null;
 return S.docs.find(d=>d.testType===ex.testType&&Math.abs(d.date-ex.date)<86400000*2);
}

/* ===================== Ask SAATH: global query engine =====================
   Generalizes the old canned ans() into real intent + authorization-aware
   lookups against S. Still gated by isClinical() for anything asking for a
   clinical judgment — SAATH states facts and sources, never meaning. Every
   authorized answer carries zero or more {label,act} inline next-step
   controls wired to REAL data-act handlers (never decorative). */
function askRoleAuthorized(role,topic){
 /* Priya (payer) has no clinical/records visibility; Karan (caregiver) has
    report/appointment/record visibility but not dose-confirmation or
    payment detail; Ramesh sees everything about her own care. */
 if(role==='meera')return true;
 if(topic==='clinical'||topic==='dosecheck')return false;
 if(role==='arjun')return topic==='payment'||topic==='insurance';
 if(role==='neha')return topic!=='payment';
 return false;
}
function askSaath(q,role){
 role=role||S.viewer;
 if(isEmergency(q))return{emergency:true};
 if(isClinical(q))return{ref:1,topic:'clinical'};
 const s=q.toLowerCase();const has=(...w)=>w.some(x=>s.includes(x));
 let topic='general',text,source,actions=[];
 if(has('spend','spent','allowance','money','waiting on me','approve')){
  topic='payment';const rf=S.refill;
  text=inr(S.money.spent)+' utilised of the '+inr(S.money.reserve)+' reserve, '+inr(reserveLeft())+' remaining, '+S.money.daysLeft+' days left to run. Per-order limit: '+inr(S.money.limit)+'.'+(rf.step==='needsapproval'?' One refill request ('+inr(rf.newAmount||S.refillAmount||2800)+') is waiting for Priya’s approval.':'');
  source='payment ledger';actions=[{label:'Open Home',act:'tab:home'}];
 } else if(has('pending','open','to do','what needs','what is still')){
  topic='general';
  const open=S.tasks.filter(isOpenTask);
  text=open.length?open.length+' thing'+(open.length===1?'':'s')+' open: '+open.map(x=>x.title).join('; ')+'.':'Nothing open right now.';
  source='open tasks';actions=[{label:'View tasks',act:'tab:care'}];
 } else if(has('appointment','next visit','dr','doctor visit')){
  topic='general';const next=S.appts.find(a=>a.stage==='upcoming');
  text=next?('Next appointment: '+next.doctor+', '+fDT(next.when)+', '+next.place+'.'):'No appointment is booked.';
  source='appointments';actions=next?[{label:'View details',act:'tab:care:appts'}]:[{label:'Find a slot',act:'care:findslot'}];
 } else if(has('prescription','wrote','written','instruction')){
  topic='clinical-fact';const latest=S.docs.find(d=>d.docType==='rx'&&d.latest)||S.docs.find(d=>d.docType==='rx');
  text=latest?('Last written on '+fD(latest.date)+' by '+(S.family[latest.doctorId]?S.family[latest.doctorId].name:'the prescriber')+'. '+S.meds.length+' medicines on file.'):'No prescription on file.';
  source=latest?latest.title:'prescriptions';actions=latest?[{label:'View report',act:'rec:doc:'+latest.id}]:[];
 } else if(has('stock','how much medicine','left')){
  topic='general';const low=S.meds.filter(m=>m.status==='active').map(m=>m.name+': '+m.stock+' day'+(m.stock===1?'':'s'));
  text=low.length?low.join('; ')+'.':'No active medicines on file.';
  source='medicine stock';actions=[{label:'Check stock',act:'tab:care:meds'}];
 } else if(has('report','test result','cbc','lipid','glucose','sugar','lab')){
  topic='clinical-fact';const crit=parseRecordQuery(q);const found=filterDocs(crit.docType?crit:Object.assign({docType:'lab'},crit));
  text=found.length?('Found '+found.length+' matching report'+(found.length===1?'':'s')+': '+found.map(d=>d.title).join(', ')+'.'):'Nothing on file matches that.';
  source='record library';actions=found.slice(0,2).map(d=>({label:'View report',act:'rec:doc:'+d.id}));
  if(!found.length)actions=[{label:'Arrange a test',act:'tab:care:checkups'}];
 } else if(has('follow-up','followup','review again')){
  topic='general';const fu=S.tasks.find(x=>/follow-?up/i.test(x.title));
  text=fu?('Follow-up status: '+fu.title+' — '+STATUS[fu.status].en+'.'):'No follow-up is currently tracked.';
  source='tasks';actions=fu?[{label:'Book follow-up',act:'care:findslot'}]:[];
 } else if(has('insurance','covered','network','claim','pre-auth','preauth')){
  topic='insurance';
  text='Policy '+S.insurance.policyDoc.number+' covers '+inr(S.insurance.coverage)+', renews '+fD(S.insurance.renewal)+'. '+S.insurance.claims+' claims on file.';
  source='uploaded policy';actions=[{label:'Open insurance',act:'tab:insurance'}];
 } else if(has('took','taken','confirm','dose')){
  topic='dosecheck';text='Whether a dose was taken is visible to Ramesh only.';source='reminder rules';
 } else if(has('bp','blood pressure','pressure','hb','haemoglobin','hemoglobin','cholesterol','sugar','glucose')){
  topic='clinical-fact';
  const key=has('bp','blood pressure','pressure')?'bp':has('hb','haemoglobin','hemoglobin')?'hb':has('cholesterol')?'chol':'sugar';
  const l=S.labs[key];
  text=l.n+': '+labAnswer(key).a;
  source='lab trend';actions=[{label:'View trend',act:'historyOpen'}];
 } else {
  text=null;
 }
 if(!text)return null;
 if(!askRoleAuthorized(role,topic))return{unauthorized:true,topic};
 return{a:text,src:source,actions};
}

/* ===================== emergency gate =====================
   Deliberately separate from the clinical-judgment GATE above: these
   patterns catch likely emergencies. SAATH NEVER renders its own urgency
   verdict ("this is/isn't an emergency") — it only records the input and
   points to a human/professional/emergency service, every time. */
const EMERGENCY_GATE=[
 /chest pain/i,/can'?t breathe|difficulty breathing|shortness of breath/i,
 /unconscious|not responding|unresponsive/i,/severe bleeding|bleeding heavily/i,
 /stroke|face.*droop|slurred speech/i,/heart attack/i,/seizure|fit(ting)?\b/i,
 /emergency/i,/\bambulance\b/i,/behosh|saans nahi/i
];
const isEmergency=q=>EMERGENCY_GATE.some(r=>r.test(q));

}

/* ===================== meal / food context =====================
   Reads ONLY the clinician-recorded instruction text already attached to a
   medicine's dose string (e.g. "after breakfast"). No calories, no diet
   advice, no health judgment — a timing fact or nothing at all. */
function mealContext(m){
 const s=(m.dose||'').toLowerCase();
 if(s.includes('after breakfast'))return t('नाश्ते के बाद लें','Take after breakfast');
 if(s.includes('with food')||s.includes('with meals'))return t('खाने के साथ लें','Take with food');
 if(s.includes('empty stomach'))return t('खाली पेट लें','Take on an empty stomach');
 return null;
}

/* ===================== Medicines ===================== */
/* Refill cadence thresholds (days of stock remaining) — crossing one of
   these bands surfaces a reminder banner on the card; derived from stock
   and daily dose rate, never hardcoded to a date. */
function refillDaysLeft(m){return m.daily>0?Math.floor(m.stock/m.daily):999;}
function refillBand(days){
 if(days<=1)return{tier:1,label:t('आज ख़त्म हो सकती है','Could run out today')};
 if(days<=3)return{tier:3,label:t('3 दिन में ख़त्म','3 days left')};
 if(days<=7)return{tier:7,label:t('7 दिन में ख़त्म','7 days left')};
 if(days<=14)return{tier:14,label:t('14 दिन में ख़त्म','14 days left')};
 return null;
}
function medCard(m){
 const accent=m.status==='active'?'var(--brand)':'var(--crit-fg)';
 const days=refillDaysLeft(m);const band=m.status==='active'?refillBand(days):null;
 const dueForReminder=band&&m.remindAfter<=S.now;
 const confirmedLabel=m.confirmedBy==='meera'?t('रमेश ने लिया बताया','Ramesh confirmed taken'):
  (m.caregiverMarked?t('करण ने दिया बताया','Karan marked as given'):null);
 const meal=mealContext(m);
 return '<div class="card lift" style="display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1),inset 3px 0 0 '+accent+'"><div class="row between" style="align-items:flex-start"><div><h3 style="font:600 var(--t-4) var(--fd)">'+m.name+' <span style="font-weight:500;font-size:var(--t-2)">'+m.str+'</span></h3><p class="muted" style="font-size:var(--t-2);margin-top:2px">'+m.dose+'</p>'+(meal?'<span class="micro" style="background:var(--surface-2);margin-top:6px">'+ic('info')+esc(meal)+'</span>':'')+'</div>'+chip(m.status==='active'?'confirmed':'onhold')+'</div>'+
 (m.status==='active'?'<div><div class="row between" style="font-size:var(--t-2)"><span class="muted">'+(m.stockConfidence==='confirmed'?t('पुष्टि की गई स्टॉक','Confirmed stock'):t('अनुमानित स्टॉक','Estimated stock'))+'</span><b>'+m.stock+' '+t('दिन','day'+(m.stock===1?'':'s'))+'</b></div><div class="pbar'+(m.stockConfidence==='confirmed'?'':' pbar-dash')+'" style="margin-top:6px"><i style="width:'+Math.min(100,m.stock*12)+'%"></i></div></div>':'')+
 (dueForReminder?'<div class="card card-saff" style="padding:9px 12px;box-shadow:none"><p style="font-size:var(--t-2)"><b>'+ic('alert')+' '+band.label+'</b> — '+t('रीफ़िल करने का समय है।','time to refill.')+'</p></div>':'')+
 (confirmedLabel?'<p class="muted" style="font-size:var(--t-1)">'+ic('check')+' '+confirmedLabel+(m.escalated?' · '+t('करण को सूचित किया गया','Karan was notified'):'')+'</p>':
  (m.escalated?'<p class="muted" style="font-size:var(--t-1)">'+ic('alert')+' '+t('अपुष्ट — करण को सूचित किया गया','Unconfirmed — Karan was notified')+'</p>':''))+
 '<p class="ink3" style="font-size:var(--t-1)">'+m.src+'</p>'+
 '<div class="row" style="flex-wrap:wrap">'+(m.status==='active'?
  '<button class="btn btn-pri btn-sm" data-act="med:taken:'+m.id+'">'+ic('check')+t('लिया','Taken')+'</button>'+
  '<button class="btn btn-sec btn-sm" data-act="med:snooze:'+m.id+'">'+ic('clock')+t('स्नूज़','Snooze')+'</button>'+
  '<button class="btn btn-ghost btn-sm" data-act="med:help:'+m.id+'">'+ic('ask')+t('मदद चाहिए','Need help')+'</button>'+
  '<button class="btn btn-sec btn-sm" data-act="med:checkstock:'+m.id+'">'+ic('box')+t('स्टॉक जाँचें','Check stock')+'</button>'+
  '<button class="btn btn-sec btn-sm" data-act="med:verifypack:'+m.id+'">'+ic('search')+t('पैक जाँचें','Verify pack')+'</button>'+
  '<button class="btn btn-sec btn-sm" data-act="med:refill:'+m.id+'">'+ic('truck')+t('रीफ़िल','Refill')+'</button>'+
  (dueForReminder?'<button class="btn btn-ghost btn-sm" data-act="med:remindlater:'+m.id+'">'+ic('bell')+t('बाद में याद दिलाएँ','Remind later')+'</button>':'')
  :'<button class="btn btn-sec btn-sm" data-act="med:view:'+m.id+'">'+t('प्रिस्क्रिप्शन देखें','View prescription')+'</button>')+'</div></div>';
}

/* ===================== pack-photo verification UI =====================
   Reuses the .cmp/.cmp-row compare-table CSS rather than inventing new
   markup. Never states "safe"/"unsafe" — only what differs structurally
   and who is authorised to resolve it. */
function packVerifySheetBody(medId){
 const m=S.meds.find(x=>x.id===medId);if(!m)return '<div class="sheet-handle"></div>';
 const scenarios=[['exact',t('ठीक मिलान','Looks like an exact match')],['strength',t('ताक़त अलग लगती है','Strength looks different')],
  ['extra',t('एक अतिरिक्त चीज़ दिखती है','An extra ingredient is listed')],['missing',t('एक चीज़ गायब लगती है','One ingredient seems missing')],

/* ===================== trend chart =====================
   Form follows evidence count, and it is a hard gate:
   1 reading  -> no chart at all, the number IS the chart
   2 readings -> two points, never a connecting line. Two values are not a trend.
   3+         -> a smooth curve through the readings, with a dot on every real reading.
   The curve is a monotone cubic (Fritsch-Carlson): between two readings it never rises above or falls below them.
   It only joins the dots. It is not a measurement, and the chart says so. The x-axis is real time, the y-axis always
   holds the whole printed range, and the only colour is the brand stroke: no red, no green, no verdicts.
   Flags are only the letter the lab printed. The SVG is built at the real pixel width (fitCharts) so type stays at --t-1. */
function monoPath(P){
 const n=P.length,dx=[],s=[],m=[];
 for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];s[i]=(P[i+1][1]-P[i][1])/dx[i];}
 m[0]=s[0];m[n-1]=s[n-2];
 for(let i=1;i<n-1;i++)m[i]=s[i-1]*s[i]<=0?0:(s[i-1]+s[i])/2;
 for(let i=0;i<n-1;i++){
  if(s[i]===0){m[i]=m[i+1]=0;continue;}
  const a=m[i]/s[i],b=m[i+1]/s[i],h=a*a+b*b;
  if(h>9){const k=3/Math.sqrt(h);m[i]=k*a*s[i];m[i+1]=k*b*s[i];}
 }
 let d='M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);
 for(let i=0;i<n-1;i++){const h=dx[i]/3;
  d+=' C'+(P[i][0]+h).toFixed(1)+','+(P[i][1]+m[i]*h).toFixed(1)+' '+(P[i+1][0]-h).toFixed(1)+','+(P[i+1][1]-m[i+1]*h).toFixed(1)+' '+P[i+1][0].toFixed(1)+','+P[i+1][1].toFixed(1);}
 return d;
}
